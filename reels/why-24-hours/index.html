  fillPoly([[-40,700],[330,780],[360,1080],[-40,1120]],P.hood);fillPoly([[-40,1000],[360,1000],[360,1080],[-40,1120]],P.hoodS);

  for(let i=0;i<60;i++){const a=i/60*Math.PI*2,l=i%5?10:24;limb(wx+Math.cos(a)*(R-14),wy+Math.sin(a)*(R-14),wx+Math.cos(a)*(R-14-l),wy+Math.sin(a)*(R-14-l),i%5?2:5,'#2b2f36')}

}
function earth(lt,p,b,g){
  vgrad(0,H,[[0,'#06080d'],[1,'#0c1018']]);stars(52,220,H,lt);
  sunDisc(-60,900,120);
  const ex=600,ey=900,R=270;
  ctx.save();ctx.beginPath();ctx.arc(ex,ey,R,0,7);ctx.clip();rr(ex-R,ey-R,2*R,2*R,0,'#2a5c86');
  const r=rng(9),blobs=[...Array(9)].map(()=>({x:r()*1400,y:ey-R+r()*2*R,w:80+r()*170,h:50+r()*140}));
  const off=lt*120;for(const o of blobs){const x=((o.x-off)%1400+1400)%1400-200+ex-R;ctx.fillStyle='#4f8a55';ctx.beginPath();ctx.ellipse(x,o.y,o.w,o.h,.4,0,7);ctx.fill();ctx.fillStyle='#5e9a60';ctx.beginPath();ctx.ellipse(x+20,o.y-10,o.w*.6,o.h*.5,.4,0,7);ctx.fill()}

  ctx.restore();ctx.strokeStyle='rgba(140,190,255,.35)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(ex,ey,R+4,0,7);ctx.stroke();
  // axis + rotation arrow
  ctx.save();ctx.translate(ex,ey);ctx.rotate(.41);limb(0,-R-90,0,R+90,4,'rgba(243,236,226,.6)');ctx.restore();
  const q=seg(lt,.3,g.dur-.3);ctx.strokeStyle=P.or;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.ellipse(ex,ey+R+40,R*.9,60,0,Math.PI*.15,Math.PI*.15+Math.PI*1.7*q);ctx.stroke();
  const a=Math.PI*.15+Math.PI*1.7*q,ax=ex+Math.cos(a)*R*.9,ay=ey+R+40+Math.sin(a)*60;circ(ax,ay,12,P.or);
  const hh=Math.floor(24*q),mm=Math.floor((24*q%1)*60);ctx.save();rr(CX-170,300,340,110,18,'rgba(20,24,32,.9)');ctx.strokeStyle=P.or;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(CX-170,300,340,110,18);ctx.stroke();
  txt(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} HRS`,CX,356,58,P.ink);ctx.restore();
}

  vgrad(0,H,[[0,`rgb(${lerp(110,12,night)},${lerp(160,17,night)},${lerp(205,30,night)})`],[.62,`rgb(${lerp(235,30,night)},${lerp(200,36,night)},${lerp(150,52,night)})`],[1,'#2a1e18']]);

  const sa=Math.PI*(1.1+.8*seg(lt,0,g.dur*.5));if(night<1)sunDisc(540+Math.cos(sa)*520,1180+Math.sin(sa)*820,70,1-night);
  vgrad(1180,H,[[0,`rgb(${lerp(200,50,night)},${lerp(150,38,night)},${lerp(95,30,night)})`],[1,'#1d1512']]);
  // obelisk + shadow
  const ox=540,oy=1380,sx=Math.cos(sa),sh=-sx*380;
  fillPoly([[ox-30,oy],[ox+sh-10,oy+60],[ox+sh+10,oy+60],[ox+30,oy]],`rgba(0,0,0,${.35*(1-night)})`);
  fillPoly([[ox-40,oy],[ox-26,oy-560],[ox,oy-610],[ox+26,oy-560],[ox+40,oy]],'#b98a5a');fillPoly([[ox,oy-610],[ox+26,oy-560],[ox+40,oy],[ox+6,oy]],'#8a6440');
  for(let i=0;i<5;i++)rr(ox-8,oy-500+i*80,16,30,3,'rgba(80,50,30,.5)');
  for(let i=0;i<7;i++){const a=Math.PI*(.15+i*.7/6);limb(ox+Math.cos(a)*240,oy+40+Math.sin(a)*60,ox+Math.cos(a)*270,oy+44+Math.sin(a)*66,5,'rgba(60,40,25,.6)')}
  tag('ANCIENT','EGYPT',pop(.2,lt,.3));
}
function dial(lt,p,b){
  vgrad(0,H,[[0,'#10151d'],[1,'#1a212b']]);const x=CX,y=900,R=330;
  const d=seg(lt,.2,b(0)+(b(1)-b(0))*.55),n=seg(lt,b(0)+(b(1)-b(0))*.45,b(1)-.1),all=pop(b(1),lt,.6);
  for(let i=0;i<24;i++){const day=i<12,a0=Math.PI+(day?i:i-12)/12*Math.PI*(day?1:-1)*1,a=day?Math.PI+i/12*Math.PI:Math.PI-(i-12)/12*Math.PI,a2=day?a+Math.PI/12:a-Math.PI/12;
    const on=day?i/12<d:(i-12)/12<n;ctx.fillStyle=on?(day?'#f2b33a':'#5b8fd6'):'rgba(255,255,255,.07)';ctx.beginPath();ctx.arc(x,y,R,Math.min(a,a2)+.012,Math.max(a,a2)-.012);ctx.arc(x,y,R-90,Math.max(a,a2)-.012,Math.min(a,a2)+.012,true);ctx.fill()}
  if(all>0){glow(x,y,R+150,P.orS,.35*all)}
  sunDisc(x,y-R-110,40,1);circ(x,y+R+110,36,P.moon);circ(x+16,y+R+100,30,'#1a212b');
  txt('12 DIN',x,y-150,60,'#f2b33a');txt('12 RAAT',x,y+150,60,'#8fb6ea');
  limb(x-R-30,y,x+R+30,y,3,'rgba(243,236,226,.4)');
  if(all>0){ctx.save();ctx.globalAlpha=all;rr(x-150,y-70,300,140,24,'#141920');txt('24',x,y,120,P.or);ctx.restore()}
}
function babylon(lt,p,b){

  const base=1350,tiers=[[760,120],[560,110],[380,100],[220,90]];let y=base;
  tiers.forEach(([w,h],i)=>{rr(CX-w/2,y-h,w,h,4,i%2?'#6e5a44':'#7c654c');for(let k=0;k<w/40;k++)rr(CX-w/2+10+k*40,y-h+16,20,h-32,3,'rgba(0,0,0,.12)');y-=h});
  fillPoly([[CX-60,base],[CX+60,base],[CX+30,base-430],[CX-30,base-430]],'#5c4a38');for(let k=0;k<14;k++)limb(CX-52+k*2.2,base-k*30,CX+52-k*2.2,base-k*30,3,'rgba(0,0,0,.2)');

function clock(lt,p,b){
  vgrad(0,H,[[0,'#10151d'],[1,'#1a212b']]);const x=CX,y=900,R=310;
  circ(x,y,R+24,'#2a2f37');circ(x,y,R,'#eee9de');
  const sp=seg(lt,b(1),b(2)),mp=seg(lt,b(2),b(2)+1.4);
  for(let i=0;i<60;i++){const a=i/60*Math.PI*2-Math.PI/2,l=i%5?14:32,on=i/60<sp;limb(x+Math.cos(a)*(R-16),y+Math.sin(a)*(R-16),x+Math.cos(a)*(R-16-l),y+Math.sin(a)*(R-16-l),i%5?3:7,on?P.or:'#2b2f36')}

}
