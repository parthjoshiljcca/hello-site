function endcard(t,L10,L11){

  const f=eo(seg(t,L11.start+L11.dur*.7,L11.start+L11.dur*.7+.35));if(f>0){ctx.save();ctx.globalAlpha=f;ctx.font='700 40px Montserrat';const txt='Follow  @thewhyspaces',w=ctx.measureText(txt).width+80;

}

function makeGrain(){for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=540;c.height=960;const x=c.getContext('2d'),im=x.createImageData(540,960),r=rng(100+k);

}
function earth(lt,p,b,g){

  sunDisc(-60,900,120);
