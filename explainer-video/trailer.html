<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --navy:#0a2c63; --deep:#020b1c; --amber:#f5b301; --amber-d:#e79a00; --ink:#fff; --muted:#a9b8d3; --red:#ff3b4e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#000; font-family:Inter, sans-serif; color:var(--ink); }
  #world { position:absolute; inset:0; transform-origin:50% 50%; }
  #bg { position:absolute; inset:-40px; background:
        radial-gradient(900px 600px at var(--gx,70%) var(--gy,30%), rgba(39,88,170,.55), transparent 65%),
        radial-gradient(800px 600px at 15% 90%, rgba(245,179,1,.10), transparent 60%),
        linear-gradient(160deg, #06214a 0%, #031431 55%, #010813 100%); }
  #grid { position:absolute; left:-50%; width:200%; height:900px; bottom:-260px; transform:perspective(700px) rotateX(72deg);
          background-image:linear-gradient(rgba(120,170,255,.22) 2px, transparent 2px), linear-gradient(90deg, rgba(120,170,255,.22) 2px, transparent 2px);
          background-size:120px 120px; -webkit-mask-image:linear-gradient(to top, #000 10%, transparent 85%); }
  canvas { position:absolute; inset:0; }
  .layer { position:absolute; inset:0; opacity:0; }
  .center { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .big { font:800 104px/1.05 'Inter Display', Inter; letter-spacing:-3px; }
  .huge { font:900 190px/0.95 'Inter Display', Inter; letter-spacing:-6px; text-transform:uppercase; }
  .sub { font:500 40px/1.3 Inter; color:var(--muted); margin-top:26px; }
  .amber { color:var(--amber); }
  .logo { width:190px; height:190px; border-radius:52px; background:linear-gradient(160deg,#ffc21a,var(--amber-d)); display:grid; place-items:center; box-shadow:0 0 120px rgba(245,179,1,.55); }
  .logo.sm { width:120px; height:120px; border-radius:34px; }
  .wordmark { font:800 150px/1 'Inter Display', Inter; letter-spacing:-5px; margin-top:40px; }
  .wordmark span { background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; }
  .wm-a { background-image:linear-gradient(100deg, #fff 40%, #fff6c9 48%, #fff 56%); }
  .wm-b { background-image:linear-gradient(100deg, var(--amber) 40%, #fff3b0 48%, var(--amber) 56%); }
  .phone { position:absolute; width:340px; height:690px; border-radius:50px; background:#0b0f16; padding:12px;
           box-shadow:0 60px 120px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.1) inset; }
  .glass { position:relative; width:100%; height:100%; border-radius:40px; overflow:hidden; background:#f7f9fc; }
  .glass img { position:absolute; left:0; width:100%; }
  .glow { position:absolute; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, rgba(245,179,1,.30), transparent 62%); }
  .cut .word { position:absolute; top:300px; width:1050px; white-space:nowrap; }
  .cut .word .ghost { position:absolute; left:0; right:0; top:0; text-align:inherit; color:transparent; -webkit-text-stroke:2px rgba(245,179,1,.55); }
  .cut .sub { position:absolute; top:520px; width:820px; margin:0; text-align:inherit; }
  .stat { width:480px; text-align:center; }
  .stat b { display:block; white-space:nowrap; font:900 150px/1 'Inter Display', Inter; color:var(--amber); letter-spacing:-5px; }
  .stat span { font:500 36px Inter; color:#e6edf8; }
  .card { position:absolute; top:330px; width:700px; padding:46px 50px; border-radius:36px; }
  .card.u { left:200px; background:linear-gradient(160deg,#0b3d86,#03204a); border:1px solid rgba(255,255,255,.14); }
  .card.c { right:200px; background:#fff; color:#0a2c63; border:3px solid #f7d67a; }
  .card .tag { display:inline-block; padding:8px 18px; border-radius:30px; font:600 24px Inter; margin-bottom:20px; }
  .card.u .tag { background:rgba(255,255,255,.12); color:var(--amber); }
  .card.c .tag { background:#fdf0c8; color:#0a2c63; }
  .card h3 { font:800 56px/1.05 'Inter Display', Inter; margin-bottom:24px; }
  .card li { list-style:none; font:500 30px/1.3 Inter; margin:12px 0; display:flex; gap:16px; align-items:center; }
  .card li i { width:30px; height:30px; border-radius:50%; flex:none; background:var(--amber); }
  .card.c li i { background:#0a2c63; }
  .label { position:absolute; top:128px; width:100%; text-align:center; font:800 64px 'Inter Display', Inter; letter-spacing:6px; text-transform:uppercase; }
  .clock { font:700 230px/1 'JetBrains Mono', monospace; letter-spacing:-6px; }
  .chips { display:flex; gap:20px; margin-top:44px; }
  .chip { padding:14px 28px; border-radius:40px; border:1px solid rgba(255,255,255,.25); font:500 30px Inter; color:#e6edf8; background:rgba(255,255,255,.05); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; mix-blend-mode:screen; }
  #vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
  .bar { position:absolute; left:0; width:100%; height:100px; background:#000; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; }
</style>
</head>
<body>
<div id="world">
  <div id="bg"></div>
  <div id="grid"></div>
  <canvas id="particles" width="1920" height="1080"></canvas>
  <div id="stage"></div>
</div>
<div id="flash"></div>
<canvas id="grain" width="480" height="270" style="width:1920px;height:1080px;opacity:.07;mix-blend-mode:overlay"></canvas>
<div id="vignette"></div>
<div class="bar" style="top:0"></div><div class="bar" style="bottom:0"></div>
<div id="fade"></div>
<script>
const LOCK = (s, c = '#11223f', w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><rect x="7" y="13" width="7" height="5" rx="1"/><path d="M8.5 13v-1.5a2 2 0 0 1 4 0V13"/></svg>`;
const CROP_TOP = 118, SHOT_W = 1080;
let CUES = null;

// ---- helpers -------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const ramp = (t, a, d, f = easeIO) => f((t - a) / d);
const win = (t, a, b, i = .15, o = .2) => Math.min(ramp(t, a, i), 1 - ramp(t, b - o, o));
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const $ = (sel, root = document) => root.querySelector(sel);
const css = (el, o) => Object.assign(el.style, o);
function layer(html, cls = '') { const d = document.createElement('div'); d.className = 'layer ' + cls; d.innerHTML = html; $('#stage').appendChild(d); return d; }
function phone(src) { return `<div class="phone"><div class="glass"><img src="screens/${src}"></div></div>`; }
function scrollPhone(ph, frac) {
  const img = $('img', ph), g = $('.glass', ph), scale = g.clientWidth / SHOT_W;
  const maxScroll = Math.max(0, (img.naturalHeight - CROP_TOP - 130) * scale - g.clientHeight);
  img.style.top = `${-CROP_TOP * scale - frac * maxScroll}px`;
}
function kinetic(el, t, a) {  // big word: tracking collapses, blur clears, scale settles
  const p = ramp(t, a, .45, easeOut);
  css(el, { letterSpacing: `${(1 - p) * 40 - 6}px`, filter: `blur(${(1 - p) * 14}px)`, transform: `scale(${1.18 - .18 * p})`, opacity: p });
}

// ---- scenes --------------------------------------------------------------
const S = {};
function build(cues) {
  CUES = cues;
  const hook = ['Every exam season,', 'thousands of question papers', 'travel by email, pen drives and couriers.', 'One leak is all it takes.'];
  S.hook = hook.map(txt => layer(`<div class="big" style="max-width:1500px">${txt}</div>`, 'center'));
  S.logo = layer(`<div class="logo">${LOCK(110)}</div><div class="wordmark"><span class="wm-a">Paper</span><span class="wm-b">Dispatch</span></div>
                  <div class="sub" style="font-size:44px">Exam papers, delivered <span class="amber">right on time.</span></div>`, 'center');
  const cuts = [
    ['Upload', 'Question papers as PDFs, one by one or in bulk.', '11-hero.jpg', 0],
    ['Schedule', 'One paper. Many colleges. One click.', '14-features.jpg', .32],
    ['Time-lock', 'Opens only when the exam begins.', '12-preview.jpg', 0],
    ['Track', 'Every download, logged and exportable.', '13-stats.jpg', 0],
    ['Auto-delete', 'Gone for good, seven days after the exam.', '15-how-it-works.jpg', 1]
  ];
  S.cuts = cuts.map(([w, sub, src, fr], i) => {
    const right = i % 2 === 0;
    const el = layer(`<div class="glow"></div>${phone(src)}
      <div class="word huge" style="font-size:${Math.min(190, Math.round(1000 / (w.length * .68)))}px;${right ? 'left:150px;text-align:left' : 'right:150px;text-align:right'}"><span class="ghost">${w}</span><span class="fill">${w}</span></div>
      <div class="sub" style="${right ? 'left:156px;text-align:left' : 'right:156px;text-align:right'}">${sub}</div>`, 'cut');
    el.dataset.right = right ? 1 : 0; el.dataset.frac = fr;
    return el;
  });
  S.stats = layer(`<div style="display:flex;gap:40px">
      <div class="stat"><b data-n="100" data-s="%">0%</b><span>Downloads logged</span></div>
      <div class="stat"><b data-n="7" data-s=" days">0 days</b><span>Auto-delete after exam</span></div>
      <div class="stat"><b data-n="0" data-s="" data-down="1">0</b><span>Papers opened early</span></div></div>`, 'center');
  S.roles = layer(`<div class="big" style="position:absolute;top:150px;width:100%;text-align:center;font-size:76px">Two roles. <span class="amber">One secure workflow.</span></div>
    <div class="card u"><div class="tag">Runs the exam cycle</div><h3>University / Chairperson</h3><ul>
      <li><i></i>Add colleges & admin logins</li><li><i></i>Upload papers in bulk</li><li><i></i>Schedule many colleges at once</li><li><i></i>Export every download</li></ul></div>
    <div class="card c"><div class="tag">Receives the papers</div><h3>College Admin</h3><ul>
      <li><i></i>Sign in with university details</li><li><i></i>See the exam schedule</li><li><i></i>Download when the window opens</li><li><i></i>Works on any phone or computer</li></ul></div>`);
  S.admin = layer(`<div class="sub" style="margin:0 0 18px;letter-spacing:8px;text-transform:uppercase;font-weight:700;font-size:30px;color:var(--amber)">Introducing the</div>
    <div class="huge" style="font-size:170px">College Admin</div><div class="sub">Sign in. Unlock. Download.</div>`, 'center');
  const car = [['Sign in', '04-login-filled.jpg'], ['Set your password', '05-set-password.jpg'], ['Your dashboard', '06-dashboard.jpg'],
               ['Your schedule', '07-papers.jpg'], ['Live status', '12-preview.jpg'], ['Download', '08-downloads.jpg']];
  S.carousel = layer(car.map(([, src]) => phone(src)).join('') + car.map(([l]) => `<div class="label">${l}</div>`).join(''));
  S.count = layer(`<div class="sub" style="margin:0 0 30px;letter-spacing:8px;text-transform:uppercase;font-weight:700;font-size:32px">Exam starts in</div>
    <div class="clock">00:00:04</div>
    <div class="unlocked" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="logo" style="width:170px;height:170px">${'<svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#11223f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path class="shackle" d="M8 11V7a4 4 0 0 1 8 0"/></svg>'}</div>
      <div class="huge amber" style="font-size:180px;margin-top:40px">Unlocked</div></div>`, 'center');
  S.final = layer(`<div class="logo sm">${LOCK(70)}</div><div class="wordmark" style="font-size:130px;margin-top:30px"><span class="wm-a">Paper</span><span class="wm-b">Dispatch</span></div>
    <div class="sub" style="font-size:46px;color:#fff;margin-top:30px">paperdispatch.app</div>
    <div class="chips"><div class="chip">⏱ Time-locked</div><div class="chip">📜 Fully logged</div><div class="chip">🔒 Auto-deleted</div></div>`, 'center');
  return Promise.all([...document.images].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
}

// ---- per-frame -----------------------------------------------------------
function render(t) {
  const C = CUES;
  // camera: slow drift + shake on impacts
  let sx = 0, sy = 0, zoom = 1.02 + .015 * Math.sin(t * .4), flash = 0;
  for (const im of C.impacts) {
    const d = t - im.at;
    if (d >= 0 && d < 1.5) {
      const k = im.size * Math.exp(-d * 7);
      sx += k * 22 * Math.sin(d * 90); sy += k * 16 * Math.cos(d * 77);
      zoom += k * .04; flash = Math.max(flash, im.size * .85 * Math.exp(-d * 9));
    }
  }
  for (const g of C.glitches) { const d = t - g; if (d >= 0 && d < .12) { sx += (rnd(t * 99) - .5) * 40; } }
  css($('#world'), { transform: `translate(${sx}px,${sy}px) scale(${zoom})` });
  $('#flash').style.opacity = clamp(flash);
  $('#bg').style.setProperty('--gx', `${60 + 15 * Math.sin(t * .23)}%`);
  $('#bg').style.setProperty('--gy', `${30 + 10 * Math.cos(t * .19)}%`);
  css($('#grid'), { backgroundPosition: `0 ${t * 90}px`, opacity: t < 8 ? .25 : .55 });
  particles(t); grain(t);
  $('#fade').style.opacity = clamp(1 - t / .6) + ramp(t, C.duration - 1.2, 1.2);

  // hook lines (0-8s), the last one glitches
  S.hook.forEach((el, i) => {
    const a = i * 2, v = win(t, a, a + 2, .25, .25);
    el.style.opacity = v;
    const txt = el.firstChild, p = ramp(t, a, 1.6, easeOut);
    css(txt, { transform: `scale(${1.06 - .06 * p})`, filter: `blur(${(1 - ramp(t, a, .5)) * 10}px)` });
    if (i === 3) {
      const g = C.glitches.some(x => t >= x && t < x + .14);
      txt.style.color = g ? '#ff3b4e' : '#fff';
      txt.style.textShadow = g ? `${(rnd(t * 7) - .5) * 30}px 0 rgba(255,0,60,.8), ${(rnd(t * 13) - .5) * -30}px 0 rgba(0,220,255,.8)` : '0 0 40px rgba(255,59,78,.35)';
    }
  });

  // logo reveal (8-12s)
  { const el = S.logo, v = win(t, 8, 12, .05, .2); el.style.opacity = v;
    if (v) { const lg = $('.logo', el), p = ramp(t, 8, .7, easeOut);
      css(lg, { transform: `scale(${.4 + .6 * p}) rotate(${(1 - p) * -20}deg)`, opacity: p });
      const wm = $('.wordmark', el), q = ramp(t, 8.35, .6, easeOut);
      css(wm, { opacity: q, transform: `translateY(${(1 - q) * 40}px)`, letterSpacing: `${-5 + (1 - q) * 30}px` });
      const sweep = `${100 - ramp(t, 9, 1.4) * 100}% 0`;
      wm.querySelectorAll('span').forEach(s => s.style.backgroundPosition = sweep);
      const sb = $('.sub', el), r = ramp(t, 10, .6, easeOut); css(sb, { opacity: r, transform: `translateY(${(1 - r) * 20}px)` }); } }

  // feature cuts (12-22s)
  S.cuts.forEach((el, i) => {
    const a = 12 + i * 2, v = win(t, a, a + 2, .06, .12); el.style.opacity = v;
    if (!v) return;
    const right = el.dataset.right === '1', lt = t - a;
    kinetic($('.word', el), t, a);
    const gp = ramp(t, a, .9, easeOut);
    $('.ghost', el).style.transform = `translate(${(right ? 1 : -1) * (14 + (1 - gp) * 90)}px, ${10 + (1 - gp) * 20}px)`;
    const s = $('.sub', el), q = ramp(t, a + .35, .5, easeOut); css(s, { opacity: q, transform: `translateY(${(1 - q) * 20}px)` });
    const ph = $('.phone', el), e = ramp(t, a, .6, easeOut), dir = right ? 1 : -1;
    const baseX = right ? 1240 : 340;
    css(ph, { left: `${baseX + dir * (1 - e) * 700}px`, top: '195px',
              transform: `perspective(1600px) rotateY(${dir * -(26 - lt * 7)}deg) rotateX(${6 - lt * 2}deg) rotateZ(${dir * (2 - lt)}deg)` });
    scrollPhone(ph, +el.dataset.frac * clamp(lt / 1.8));
    css($('.glow', el), { left: `${baseX - 280}px`, top: '90px', opacity: e });
  });

  // stats (22-24s), one per beat
  { const el = S.stats, v = win(t, 22, 24, .05, .15); el.style.opacity = v;
    if (v) el.querySelectorAll('.stat').forEach((st, k) => {
      const a = 22 + k * .5, p = ramp(t, a, .35, easeOut), b = $('b', st);
      css(st, { opacity: p, transform: `scale(${1.4 - .4 * p})` });
      const n = +b.dataset.n, c = b.dataset.down ? Math.round(9 * (1 - ramp(t, a, .45))) : Math.round(n * ramp(t, a, .45));
      b.textContent = c + b.dataset.s;
    }); }

  // roles (24-28s)
  { const el = S.roles, v = win(t, 24, 28, .1, .2); el.style.opacity = v;
    if (v) { const h = $('.big', el), p = ramp(t, 24, .5, easeOut); css(h, { opacity: p, transform: `translateY(${(1 - p) * 30}px)` });
      [['.card.u', 24.25, -1], ['.card.c', 24.75, 1]].forEach(([sel, a, d]) => {
        const c = $(sel, el), q = ramp(t, a, .6, easeOut);
        css(c, { opacity: q, transform: `perspective(1400px) translateX(${d * (1 - q) * 500}px) rotateY(${d * -12 * (1 - q) + d * -4}deg)` });
        c.querySelectorAll('li').forEach((li, k) => { const r = ramp(t, a + .4 + k * .25, .3, easeOut); css(li, { opacity: r, transform: `translateX(${d * (1 - r) * 30}px)` }); });
      }); } }

  // college admin title (28-30s)
  { const el = S.admin, v = win(t, 28, 30, .05, .15); el.style.opacity = v;
    if (v) { kinetic($('.huge', el), t, 28); const s = el.querySelectorAll('.sub');
      s.forEach((x, k) => { const q = ramp(t, 28.2 + k * .4, .4, easeOut); css(x, { opacity: q, transform: `translateY(${(1 - q) * (k ? 20 : -20)}px)` }); }); } }

  // admin carousel (30-36s), one screen per second
  { const el = S.carousel, v = win(t, 30, 36, .1, .2); el.style.opacity = v;
    if (v) { const f = t - 30, k = Math.floor(f), e = ramp(f - k, 0, .45, easeOut), p = k === 0 ? 0 : Math.min(5, k - 1 + e);
      el.querySelectorAll('.phone').forEach((ph, i) => {
        const d = i - p, ad = Math.min(1.6, Math.abs(d));
        css(ph, { left: `${790 + d * 520}px`, top: '250px', opacity: 1 - .55 * Math.min(1, ad), zIndex: 10 - Math.round(ad * 3),
                  transform: `perspective(1600px) rotateY(${clamp(-d * 32, -50, 50)}deg) scale(${1 - .2 * Math.min(1, ad)})` });
        scrollPhone(ph, 0);
      });
      el.querySelectorAll('.label').forEach((lb, i) => {
        const a = 30 + i, q = win(t, a, a + 1, .2, .15) * ramp(t, a + .05, .3, easeOut);
        css(lb, { opacity: q, transform: `translateY(${(1 - ramp(t, a, .35, easeOut)) * -24}px)`, color: i === 5 ? 'var(--amber)' : '#fff' });
      }); } }

  // countdown -> unlocked (36-42s)
  { const el = S.count, v = win(t, 36, 42, .1, .2); el.style.opacity = v;
    if (v) { const pre = t < 40, clk = $('.clock', el), sub = $('.sub', el), un = $('.unlocked', el);
      const n = Math.max(1, 4 - Math.floor(t - 36));
      clk.textContent = `00:00:0${n}`;
      const beat = t - Math.floor(t); css(clk, { transform: `scale(${1 + .08 * Math.exp(-beat * 8)})`, color: n === 1 ? 'var(--amber)' : '#fff', opacity: pre ? 1 : 0 });
      sub.style.opacity = pre ? 1 : 0;
      const q = ramp(t, 40, .5, easeOut); css(un, { opacity: pre ? 0 : q, transform: `scale(${1.25 - .25 * q})` });
      const sh = $('.shackle', el); if (sh) sh.setAttribute('transform', `translate(0 ${-3 * ramp(t, 40.1, .35, easeOut)}) rotate(${-25 * ramp(t, 40.3, .4, easeOut)} 16 11)`); } }

  // finale (42-50s)
  { const el = S.final, v = ramp(t, 42, .4); el.style.opacity = v;
    if (v) { const lg = $('.logo', el), p = ramp(t, 42, .8, easeOut); css(lg, { transform: `scale(${.6 + .4 * p})` });
      const wm = $('.wordmark', el), q = ramp(t, 42.3, .8, easeOut);
      css(wm, { opacity: q, letterSpacing: `${-5 + (1 - q) * 24}px` });
      wm.querySelectorAll('span').forEach(s => s.style.backgroundPosition = `${100 - ramp(t, 43.2, 1.6) * 100}% 0`);
      const url = $('.sub', el), r = ramp(t, 43.4, .6, easeOut); css(url, { opacity: r, transform: `translateY(${(1 - r) * 20}px)` });
      el.querySelectorAll('.chip').forEach((c, k) => { const s = ramp(t, 44.2 + k * .5, .4, easeOut); css(c, { opacity: s, transform: `translateY(${(1 - s) * 24}px)` }); }); } }
}

// ---- particles & grain ---------------------------------------------------
function particles(t) {
  const c = $('#particles').getContext('2d'); c.clearRect(0, 0, 1920, 1080);
  const boost = t > 12 && t < 40 ? 1.8 : 1;
  for (let i = 0; i < 140; i++) {
    const x = rnd(i) * 1920 + Math.sin(t * .5 + i) * 30, sp = 20 + rnd(i + 7) * 60;
    const y = ((rnd(i + 3) * 1200 - t * sp * boost) % 1200 + 1200) % 1200 - 60;
    const r = .8 + rnd(i + 11) * 2.6, a = .15 + rnd(i + 5) * .45;
    c.fillStyle = i % 4 ? `rgba(160,195,255,${a})` : `rgba(245,179,1,${a})`;
    c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
  }
}
let grainSeed = 1;
function grain(t) {
  const c = $('#grain').getContext('2d'), img = c.createImageData(480, 270), d = img.data;
  let s = Math.floor(t * 30) * 9973 + 1;
