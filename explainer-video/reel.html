<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --amber:#f5b301; --amber-d:#e79a00; --green:#22c55e; --muted:#a9b8d3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#000; font-family:Inter, sans-serif; color:#fff; }
  #world { position:absolute; inset:0; transform-origin:50% 45%; }
  #bg { position:absolute; inset:-60px; background:
        radial-gradient(800px 700px at 50% var(--gy,40%), rgba(39,88,170,.6), transparent 65%),
        radial-gradient(700px 600px at 20% 95%, rgba(245,179,1,.12), transparent 60%),
        linear-gradient(170deg, #06214a 0%, #031431 55%, #010813 100%); }
  #grid { position:absolute; left:-50%; width:200%; height:1100px; bottom:-300px; transform:perspective(700px) rotateX(72deg);
          background-image:linear-gradient(rgba(120,170,255,.2) 2px, transparent 2px), linear-gradient(90deg, rgba(120,170,255,.2) 2px, transparent 2px);
          background-size:120px 120px; -webkit-mask-image:linear-gradient(to top, #000 10%, transparent 85%); opacity:.5; }
  #rays { position:absolute; left:50%; top:760px; width:2400px; height:2400px; margin:-1200px 0 0 -1200px; border-radius:50%; opacity:0;
          background:repeating-conic-gradient(from 0deg, rgba(245,179,1,.16) 0deg 6deg, transparent 6deg 18deg);
          -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 60%); }
  canvas { position:absolute; inset:0; }
  .layer { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; opacity:0; padding:0 70px; }
  .kicker { font:700 34px Inter; letter-spacing:10px; text-transform:uppercase; color:var(--amber); }
  .clock { font:700 150px/1 'JetBrains Mono', monospace; letter-spacing:-4px; margin-top:40px; }
  .bar { width:640px; height:10px; border-radius:10px; background:rgba(255,255,255,.12); margin-top:56px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--amber), #ffd75e); border-radius:10px; }
  .badge { width:340px; height:340px; filter:drop-shadow(0 0 60px rgba(34,197,94,.55)); }
  .done { font:900 156px/0.92 'Inter Display', Inter; letter-spacing:-5px; text-transform:uppercase; margin-top:60px; }
  .done span { display:block; background-image:linear-gradient(100deg, #fff 40%, #fff3b0 48%, #fff 56%); background-size:300% 100%;
               -webkit-background-clip:text; background-clip:text; color:transparent; }
  .done span.g { background-image:linear-gradient(100deg, var(--amber) 40%, #fff3b0 48%, var(--amber) 56%); }
  .sub { font:500 42px/1.3 Inter; color:#dfe7f5; margin-top:40px; }
  .stat { width:900px; padding:40px 48px; border-radius:40px; margin:18px 0; display:flex; align-items:center; gap:40px; text-align:left;
          background:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.16);
          box-shadow:0 30px 80px rgba(0,0,0,.35); }
  .stat b { flex:none; width:380px; font:900 108px/1 'Inter Display', Inter; color:var(--amber); letter-spacing:-4px; white-space:nowrap; }
  .stat span { font:600 44px/1.15 Inter; }
  .logo { width:190px; height:190px; border-radius:54px; background:linear-gradient(160deg,#ffc21a,var(--amber-d)); display:grid; place-items:center; box-shadow:0 0 140px rgba(245,179,1,.55); }
  .wordmark { font:800 120px/1 'Inter Display', Inter; letter-spacing:-4px; margin-top:44px; }
  .wordmark span { background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; }
  .wm-a { background-image:linear-gradient(100deg, #fff 40%, #fff6c9 48%, #fff 56%); }
  .wm-b { background-image:linear-gradient(100deg, var(--amber) 40%, #fff3b0 48%, var(--amber) 56%); }
  .tag { font:500 40px Inter; color:#fff; margin-top:30px; }
  .credit { font:500 34px Inter; color:var(--muted); margin-top:70px; }
  .credit b { color:var(--amber); font-weight:800; }
  .ring { position:absolute; left:50%; top:760px; border-radius:50%; border:6px solid rgba(255,255,255,.8); opacity:0; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; }
  #vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
</style>
</head>
<body>
<div id="world">
  <div id="bg"></div>
  <div id="grid"></div>
  <div id="rays"></div>
  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="stage">
    <div class="layer" id="s1">
      <div class="kicker">Exam day</div>
      <div class="clock">09:59:57</div>
      <div class="bar"><i></i></div>
    </div>
    <div class="layer" id="s2">
      <svg class="badge" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" fill="rgba(34,197,94,.16)" stroke="#22c55e" stroke-width="6" stroke-linecap="round" id="ring" />
        <path d="M36 62 L53 78 L86 44" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" id="tick" />
      </svg>
      <div class="done"><span>Exam</span><span class="g">completed</span></div>
      <div class="sub">Every paper. On time. Securely.</div>
    </div>
    <div class="layer" id="s3">
      <div class="stat"><b data-n="100" data-s="%">0%</b><span>Downloads<br>logged</span></div>
      <div class="stat"><b data-n="0" data-s="" data-down="1">9</b><span>Papers<br>opened early</span></div>
      <div class="stat"><b data-n="7" data-s=" days">0 days</b><span>To auto-delete<br>every paper</span></div>
    </div>
    <div class="layer" id="s4">
      <div class="logo"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#11223f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><rect x="7" y="13" width="7" height="5" rx="1"/><path d="M8.5 13v-1.5a2 2 0 0 1 4 0V13"/></svg></div>
      <div class="wordmark"><span class="wm-a">Paper</span><span class="wm-b">Dispatch</span></div>
      <div class="tag">paperdispatch.app</div>
      <div class="credit">Designed &amp; developed by <b>Parth D. Joshi</b></div>
    </div>
  </div>
  <div class="ring" id="shock1"></div><div class="ring" id="shock2"></div>
  <canvas id="confetti" width="1080" height="1920"></canvas>
</div>
<div id="flash"></div>
<canvas id="grain" width="270" height="480" style="width:1080px;height:1920px;opacity:.06;mix-blend-mode:overlay"></canvas>
<div id="vignette"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, d, f = easeIO) => f((t - a) / d);
const win = (t, a, b, i = .15, o = .2) => Math.min(ramp(t, a, i), 1 - ramp(t, b - o, o));
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const $ = s => document.querySelector(s);
const css = (el, o) => Object.assign(el.style, o);
const IMPACTS = [{ at: 2, size: 1.1 }, { at: 8, size: .7 }];
const COLORS = ['#f5b301', '#ffffff', '#22c55e', '#5b9bff', '#ffd75e'];

function render(t) {
  // camera: slow push-in, shake + flash on impacts
  let sx = 0, sy = 0, zoom = 1.0 + .03 * (t / 10), flash = 0;
  for (const im of IMPACTS) { const d = t - im.at; if (d >= 0 && d < 1.2) { const k = im.size * Math.exp(-d * 7);
    sx += k * 18 * Math.sin(d * 90); sy += k * 14 * Math.cos(d * 70); zoom += k * .05; flash = Math.max(flash, im.size * .8 * Math.exp(-d * 10)); } }
  css($('#world'), { transform: `translate(${sx}px,${sy}px) scale(${zoom})` });
  $('#flash').style.opacity = clamp(flash);
  $('#bg').style.setProperty('--gy', `${40 + 5 * Math.sin(t * .6)}%`);
  $('#grid').style.backgroundPosition = `0 ${t * 80}px`;
  css($('#rays'), { opacity: win(t, 2, 8, .3, .5) * .9, transform: `rotate(${t * 14}deg)` });
  [['#shock1', 2], ['#shock2', 8]].forEach(([id, at]) => {
    const d = t - at, el = $(id), r = 60 + easeOut(d / .9) * 900;
    css(el, { width: `${r * 2}px`, height: `${r * 2}px`, margin: `${-r}px 0 0 ${-r}px`, opacity: d < 0 || d > 1 ? 0 : (1 - d) * .7, borderWidth: `${2 + (1 - clamp(d)) * 10}px` });
  });
  dust(t); confetti(t); grain(t);

  // 0-2s: countdown to the exam, one tick per beat
  { const el = $('#s1'); el.style.opacity = win(t, 0, 2.02, .25, .1);
    const n = Math.min(4, Math.floor(t / .5)), sec = 57 + n;
    const clk = $('#s1 .clock'); clk.textContent = sec >= 60 ? '10:00:00' : `09:59:${sec}`;
    const beat = (t % .5) / .5; css(clk, { transform: `scale(${1 + .07 * Math.exp(-beat * 6)})`, color: n >= 3 ? 'var(--amber)' : '#fff' });
    $('#s1 .bar i').style.width = `${clamp(t / 2) * 100}%`;
    const k = ramp(t, .05, .4, easeOut); css($('#s1 .kicker'), { opacity: k, letterSpacing: `${10 + (1 - k) * 20}px` }); }
  // 2-5s: completed
  { const el = $('#s2'); el.style.opacity = win(t, 2, 5, .04, .2);
    const ring = $('#ring'), tick = $('#tick'), L = 2 * Math.PI * 54;
    ring.style.strokeDasharray = L; ring.style.strokeDashoffset = L * (1 - ramp(t, 2, .5, easeOut));
    tick.style.strokeDasharray = 90; tick.style.strokeDashoffset = 90 * (1 - ramp(t, 2.3, .35, easeOut));
    const b = ramp(t, 2, .55, easeOut); css($('.badge'), { transform: `scale(${.4 + .6 * b}) rotate(${(1 - b) * -40}deg)` });
    $('.done').querySelectorAll('span').forEach((sp, k) => { const q = ramp(t, 2.25 + k * .2, .5, easeOut);
      css(sp, { opacity: q, transform: `translateY(${(1 - q) * 60}px) scale(${1.15 - .15 * q})`, filter: `blur(${(1 - q) * 10}px)`,
                backgroundPosition: `${100 - ramp(t, 3, 1.2) * 100}% 0` }); });
    const s = $('#s2 .sub'), r = ramp(t, 3.2, .5, easeOut); css(s, { opacity: r, transform: `translateY(${(1 - r) * 24}px)` }); }
  // 5-8s: stats, one per beat-and-a-half
  { const el = $('#s3'); el.style.opacity = win(t, 5, 8, .05, .2);
    el.querySelectorAll('.stat').forEach((st, k) => { const a = 5 + k * .75, p = ramp(t, a, .45, easeOut), b = st.querySelector('b');
      css(st, { opacity: p, transform: `translateX(${(1 - p) * (k % 2 ? 360 : -360)}px) rotate(${(1 - p) * (k % 2 ? 4 : -4)}deg)` });
      const n = +b.dataset.n, c = b.dataset.down ? Math.round(9 * (1 - ramp(t, a, .55))) : Math.round(n * ramp(t, a, .55));
      b.textContent = c + b.dataset.s; }); }
  // 8-10s: brand end card with light sweep
  { const el = $('#s4'); el.style.opacity = ramp(t, 8, .15);
    const p = ramp(t, 8, .6, easeOut); css($('#s4 .logo'), { transform: `scale(${.4 + .6 * p}) rotate(${(1 - p) * -25}deg)` });
    const w = ramp(t, 8.15, .6, easeOut), wm = $('#s4 .wordmark'); css(wm, { opacity: w, letterSpacing: `${-4 + (1 - w) * 26}px` });
    wm.querySelectorAll('span').forEach(s => s.style.backgroundPosition = `${100 - ramp(t, 8.6, 1.1) * 100}% 0`);
    const u = ramp(t, 8.5, .5, easeOut); css($('#s4 .tag'), { opacity: u, transform: `translateY(${(1 - u) * 20}px)` });
    const c = ramp(t, 8.85, .5, easeOut); css($('#s4 .credit'), { opacity: c, transform: `translateY(${(1 - c) * 20}px)` }); }
}

function dust(t) {
  const c = $('#dust').getContext('2d'); c.clearRect(0, 0, 1080, 1920);
  const boost = t > 2 && t < 8 ? 2 : 1;
  for (let i = 0; i < 110; i++) {
    const x = rnd(i) * 1080 + Math.sin(t * .6 + i) * 20, sp = 30 + rnd(i + 7) * 70;
    const y = ((rnd(i + 3) * 2040 - t * sp * boost) % 2040 + 2040) % 2040 - 60;
    c.fillStyle = i % 4 ? `rgba(160,195,255,${.15 + rnd(i + 5) * .4})` : `rgba(245,179,1,${.2 + rnd(i + 5) * .4})`;
    c.beginPath(); c.arc(x, y, .8 + rnd(i + 11) * 2.4, 0, 6.283); c.fill();
  }
}

function confetti(t) {  // two cannons from the bottom corners, then a centre burst on the logo
  const c = $('#confetti').getContext('2d'); c.clearRect(0, 0, 1080, 1920);
  [[2, 60, 1900, -1.05], [2, 1020, 1900, -2.09], [8, 540, 760, -Math.PI / 2]].forEach(([b0, ox, oy, dir], bi) => {
    const d = t - b0; if (d < 0 || d > 4) return;
    const count = bi < 2 ? 120 : 80, spread = bi < 2 ? 1.25 : 2.8;
    for (let i = 0; i < count; i++) {
      const s = bi * 1000 + i, ang = dir + (rnd(s) - .5) * spread, v = (bi < 2 ? 1300 : 900) + rnd(s + 1) * 2200;
      const dd = Math.max(0, d - rnd(s + 4) * .12), k = 1.4 + rnd(s + 5) * 1.6, drag = 1 - Math.exp(-dd * k);
      const x = ox + Math.cos(ang) * v * drag / k + Math.sin(dd * (2 + rnd(s + 6) * 3) + i) * 50 * dd;
      const y = oy + Math.sin(ang) * v * drag / k + (180 + rnd(s + 7) * 220) * dd * dd;
      const fade = clamp(1 - (d - 2.6) / 1.4);
      c.save(); c.translate(x, y); c.rotate(d * (4 + rnd(s + 2) * 8) + i);
      c.globalAlpha = fade; c.fillStyle = COLORS[i % COLORS.length];
      const w = 14 + rnd(s + 3) * 16;
      if (i % 5 === 0) { c.beginPath(); c.arc(0, 0, w / 3, 0, 6.283); c.fill(); }
      else c.fillRect(-w / 2, -w / 4, w, w / 2 * Math.abs(Math.cos(d * 9 + i)) + 3);
      c.restore();
    }
  });
}

function grain(t) {
  const c = $('#grain').getContext('2d'), img = c.createImageData(270, 480), d = img.data;
  let s = Math.floor(t * 30) * 9973 + 1;
  for (let i = 0; i < d.length; i += 4) { s = (s * 16807) % 2147483647; d[i] = d[i + 1] = d[i + 2] = s & 255; d[i + 3] = 255; }
  c.putImageData(img, 0, 0);
}
</script>
</body>
</html>
