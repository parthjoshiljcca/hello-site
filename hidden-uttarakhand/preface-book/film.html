<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hidden Uttarakhand — प्रस्तावना</title>
<script src="timeline.js"></script>
<style>
  @font-face { font-family:Tiro; src:url(../fonts/TiroDevanagariHindi.ttf); }
  @font-face { font-family:Mukta; font-weight:500; src:url(../fonts/Mukta-Medium.ttf); }
  @font-face { font-family:Mukta; font-weight:800; src:url(../fonts/Mukta-ExtraBold.ttf); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#05070f; color:#fff; }
  canvas#cv { position:absolute; inset:0; }
  #hdr { position:absolute; top:80px; left:0; right:0; text-align:center; font:700 24px 'JetBrains Mono', monospace; letter-spacing:6px; color:rgba(242,196,109,.85); }
  #hdr b { font:34px Tiro; letter-spacing:0; color:#f2c46d; margin-left:14px; vertical-align:-2px; }
  #cap { position:absolute; left:70px; right:70px; bottom:230px; text-align:center; font:500 50px/1.45 Mukta; color:#f3eee2; text-shadow:0 3px 18px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); }
  #cap .w { opacity:0; display:inline-block; }
  #key { position:absolute; left:60px; right:60px; top:230px; text-align:center; font:64px/1.25 Tiro; color:#f2c46d; opacity:0; text-shadow:0 0 40px rgba(242,196,109,.35), 0 6px 26px rgba(0,0,0,.9); }
  #key.red { color:#ff5a64; text-shadow:0 0 40px rgba(255,80,90,.45), 0 6px 26px rgba(0,0,0,.9); }
  #bookwrap { position:absolute; left:0; right:0; top:330px; height:900px; perspective:1600px; opacity:0; }
  #cover { position:absolute; left:290px; top:60px; width:500px; border-radius:6px; box-shadow:0 40px 90px rgba(0,0,0,.8), 0 0 120px rgba(242,196,109,.15); }
  #logo { position:absolute; left:110px; top:150px; width:860px; opacity:0; }
  #author { position:absolute; left:190px; top:1330px; width:700px; opacity:0; mix-blend-mode:screen; }
  #sign { position:absolute; left:0; right:0; top:760px; text-align:center; opacity:0; }
  #sign .n { font:150px Tiro; color:#f3eee2; }
  #sign .p { font:48px Tiro; color:#c9c2b0; margin-top:6px; }
  #sign .soon { display:inline-block; margin-top:70px; font:700 32px 'JetBrains Mono', monospace; letter-spacing:5px; color:#f2c46d; border:2px solid #f2c46d; padding:16px 34px; border-radius:999px; }
  #grain { position:absolute; inset:0; width:1080px; height:1920px; opacity:.08; mix-blend-mode:overlay; }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse 80% 65% at 50% 47%, transparent 45%, rgba(0,0,0,.78) 100%); }
  #fade { position:absolute; inset:0; background:#000; }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="bookwrap"><img id="cover" src="../roopkund/assets/book-cover.jpg"></div>
<img id="logo" src="../roopkund/assets/title-logo.png">
<img id="author" src="../roopkund/assets/author-logo.png">
<div id="sign"><div class="n">पार्थ</div><div class="p">अहमदाबाद, 2026</div><div class="soon">COMING SOON · जल्द आ रही है</div></div>
<div id="vig"></div>
<canvas id="grain" width="540" height="960"></canvas>
<div id="hdr">HIDDEN UTTARAKHAND<b>प्रस्तावना</b></div>
<div id="key"></div>
<div id="cap"></div>
<div id="fade"></div>
<script>
const W = 1080, H = 1920;
const B = {}; TIMELINE.beats.forEach(b => B[b.beat] = b);
const S = n => B[n].start, E = n => B[n].end, DURATION = TIMELINE.duration;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, k) => a + (b - a) * k;
function rng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const c = document.getElementById('cv').getContext('2d');
const beatAt = t => (TIMELINE.beats.filter(b => t >= b.start - .35).pop() || TIMELINE.beats[0]).beat;

// ---------- helpers ----------
function grad(stops, y0 = 0, y1 = H) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }
function sky(stops) { c.fillStyle = grad(stops); c.fillRect(0, 0, W, H); }
function dot(x, y, r, col) { if (!(r > 0)) return; c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
function glow(x, y, r, col) { if (!(r > 0)) return; const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); }
const STARS = (() => { const R = rng(3); return Array.from({ length: 220 }, () => [R() * W, R() * H * .55, R() * 1.8 + .4, R() * 6]); })();
function stars(t, a = 1) { for (const [x, y, r, p] of STARS) dot(x, y, r, `rgba(255,255,255,${a * (.35 + .35 * Math.sin(t * 1.5 + p))})`); }
function ridge(base, amp, col, seed, f = .006, x0 = 0) {
  c.fillStyle = col; c.beginPath(); c.moveTo(-10, H + 10);
  for (let x = -10; x <= W + 10; x += 12) { const X = x + x0; c.lineTo(x, base - amp * (.55 * Math.abs(Math.sin(X * f + seed)) + .3 * Math.abs(Math.sin(X * f * 2.7 + seed * 3)) + .15 * Math.sin(X * f * 7 + seed))); }
  c.lineTo(W + 10, H + 10); c.fill();
}
function peak(x, y, w, h, col, snow) {
  c.fillStyle = col; c.beginPath(); c.moveTo(x - w, y + h); c.lineTo(x - w * .25, y + h * .25); c.lineTo(x, y); c.lineTo(x + w * .3, y + h * .3); c.lineTo(x + w, y + h); c.fill();
  if (snow) { c.fillStyle = snow; c.beginPath(); c.moveTo(x - w * .25, y + h * .25); c.lineTo(x, y); c.lineTo(x + w * .3, y + h * .3); c.lineTo(x + w * .12, y + h * .22); c.lineTo(x, y + h * .32); c.lineTo(x - w * .1, y + h * .2); c.fill(); }
}
function fog(t, y, h, a = .25, col = '200,210,235') {
  // soft drifting banks: wide radial blobs squashed vertically
  for (let i = 0; i < 7; i++) {
    const x = ((i * 330 + t * (16 + i * 5)) % 1900) - 400, yy = y + Math.sin(i * 2.3) * h * .3;
    c.save(); c.translate(x, yy); c.scale(1, h / 1100);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, 560); g.addColorStop(0, `rgba(${col},${a * .55})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.fillRect(-560, -560, 1120, 1120); c.restore();
  }
}
function label(x, y, text, col = '#f2c46d', size = 30) {
  c.font = `700 ${size}px 'JetBrains Mono', monospace`; const w = c.measureText(text).width + 40;
  c.fillStyle = 'rgba(5,8,20,.75)'; c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.roundRect(x - w / 2, y - 28, w, 56, 8); c.fill(); c.stroke();
  c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y + 1);
}
function hiText(x, y, text, size, col, a = 1, font = 'Tiro') { c.globalAlpha = a; c.font = `${font === 'Mukta' ? '800 ' : ''}${size}px ${font}`; c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y); c.globalAlpha = 1; }
function person(x, y, s, col = '#05070f') { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col; dot(0, -150, 22, col); c.beginPath(); c.moveTo(-30, -120); c.lineTo(30, -120); c.lineTo(24, -40); c.lineTo(16, 0); c.lineTo(4, 0); c.lineTo(0, -40); c.lineTo(-4, 0); c.lineTo(-16, 0); c.lineTo(-24, -40); c.fill(); c.restore(); }
function bell(x, y, s, a, col = '#c9952c') {
  c.save(); c.translate(x, y); c.rotate(a); c.scale(s, s);
  c.strokeStyle = '#6a5228'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -80); c.lineTo(0, 0); c.stroke();
  const g = c.createLinearGradient(-30, 0, 30, 0); g.addColorStop(0, '#5e3f0e'); g.addColorStop(.4, '#f3cd63'); g.addColorStop(1, '#5e3f0e');
  c.fillStyle = g; c.beginPath(); c.moveTo(-10, 0); c.bezierCurveTo(-26, 4, -24, 34, -34, 52); c.lineTo(34, 52); c.bezierCurveTo(24, 34, 26, 4, 10, 0); c.fill(); c.restore();
}

// ---------- scenes ----------
const R = rng(11);
const SHOES = Array.from({ length: 90 }, () => ({ x: (R() - .5) * (R() * 2) * 260, h: R(), col: ['#7a3b2e', '#2f4a6b', '#c9a24a', '#3a3a3a', '#9b2f4a', '#e0dccf', '#4f6b3a'][Math.floor(R() * 7)], r: R() * 3 }));
const BELLS = Array.from({ length: 70 }, () => ({ x: R() * W, row: Math.floor(R() * 5), p: R() * 7, s: .6 + R() * .5 }));
const WINDOWS = Array.from({ length: 26 }, () => ({ x: 80 + R() * 920, y: 1180 + R() * 300, off: R() }));
const SCENES = {
  1: (u, t) => { // Ahmedabad: flat city, the flyover the tallest thing
    sky(['#1c1430', '#6b3550', '#e0844a', '#f5b56a']); glow(760, 1050, 500, 'rgba(255,170,90,.5)'); dot(760, 1050, 80, '#ffd39a');
    const R2 = rng(5); c.fillStyle = '#2a1a2c'; for (let x = -20; x < W; x += 40 + R2() * 40) { const h = 60 + R2() * 90; c.fillRect(x, 1250 - h, 34 + R2() * 30, h + 700); }
    c.fillStyle = '#1a0f1c'; c.fillRect(-20, 1110, W + 40, 36); for (let x = 40; x < W; x += 170) c.fillRect(x, 1146, 26, 120);
    for (let i = 0; i < 9; i++) { const x = ((i * 140 + t * 120) % 1300) - 100; dot(x, 1104, 5, i % 2 ? '#ffd27a' : '#ff5a50'); }
    c.fillStyle = '#120a14'; c.fillRect(0, 1260, W, 700);
    if (u > .3) { c.globalAlpha = prog(u, .3, .45); label(540, 1020, 'सबसे ऊँची चीज़ ↓', '#f2c46d', 30); c.globalAlpha = 1; }
  },
  2: (u, t) => { // the shoe heap outside the mandir
    sky(['#120914', '#2a1424', '#3b1d24']); glow(540, 900, 600, 'rgba(255,150,60,.35)');
    c.fillStyle = '#5a2e22'; c.fillRect(260, 640, 560, 560); c.fillStyle = '#7a3e24'; c.beginPath(); c.moveTo(220, 650); c.lineTo(540, 470); c.lineTo(860, 650); c.fill();
    c.fillStyle = '#ffcf7a'; c.beginPath(); c.moveTo(470, 1200); c.lineTo(470, 900); c.arc(540, 900, 70, Math.PI, 0); c.lineTo(610, 1200); c.fill(); glow(540, 1000, 300, 'rgba(255,190,90,.45)');
    for (let i = 0; i <= 16; i++) { const k = i / 16, x = 280 + k * 520, y = 690 + Math.sin(k * Math.PI) * 60; dot(x, y, 12, i % 2 ? '#f28c0f' : '#f6b31a'); }
    c.fillStyle = '#2a1712'; c.fillRect(0, 1200, W, 720);
    const n = Math.floor(SHOES.length * eout(prog(u, .2, .8)));
    for (let i = 0; i < n; i++) { const s = SHOES[i], y = 1330 - s.h * 230 * (1 - Math.abs(s.x) / 300); c.save(); c.translate(540 + s.x, y); c.rotate(s.r); c.fillStyle = s.col; c.beginPath(); c.roundRect(-30, -10, 60, 22, 10); c.fill(); c.restore(); }
    if (u > .7) { c.globalAlpha = prog(u, .7, .85); label(540, 1060, 'इकलौता "पहाड़"', '#f2c46d', 30); c.globalAlpha = 1; }
  },
  3: (u, t) => { // a tourist bus up a bright hill road
    sky(['#5f9fd3', '#a9cde6', '#f4dfb6']); glow(860, 360, 400, 'rgba(255,240,200,.6)');
    peak(380, 520, 360, 420, '#a8bcd8', '#fff'); peak(780, 600, 320, 360, '#9cb2d0', '#fff');
    ridge(1150, 260, '#7fa36a', 1.3); ridge(1400, 200, '#5d8a4d', 2.1);
    c.strokeStyle = '#d9c49a'; c.lineWidth = 26; c.lineCap = 'round'; c.beginPath(); c.moveTo(120, 1900); c.bezierCurveTo(900, 1700, 200, 1500, 760, 1300); c.stroke();
    const k = eout(prog(u, 0, 1)), bx = lerp(260, 700, k), by = lerp(1820, 1340, k);
    c.fillStyle = '#e8b83a'; c.beginPath(); c.roundRect(bx - 60, by - 40, 120, 52, 10); c.fill(); c.fillStyle = '#334'; c.fillRect(bx - 50, by - 32, 100, 18);
    if (u > .55 && u < .62) { c.fillStyle = 'rgba(255,255,255,.6)'; c.fillRect(0, 0, W, H); }
  },
  4: (u, t) => { // the postcard
    sky(['#20232e', '#2b2f3c']);
    postcard(u, 0, t);
  },
  5: (u, t) => { // it turns over: the back side
    const k = ease(prog(u, .05, .55)); sky([`rgba(32,35,46,${1 - k})`, '#05070f']); c.fillStyle = `rgba(5,7,15,${k})`; c.fillRect(0, 0, W, H);
    postcard(1, k, t);
  },
  6: (u, t) => { // the god of justice: bells and petitions
    sky(['#07060c', '#120c10', '#1d120c']); glow(540, 1100, 700, 'rgba(255,170,80,.22)');
    for (let row = 4; row >= 0; row--) {
      const y = 380 + row * 200, s = .5 + row * .22;
      c.strokeStyle = `rgba(120,90,50,${.4 + row * .1})`; c.lineWidth = 4 + row * 2; c.beginPath(); c.moveTo(0, y - 90 * s); c.lineTo(W, y - 90 * s); c.stroke();
      for (const b of BELLS.filter(b => b.row === row)) {
        const a = Math.sin(t * 2 + b.p) * .12 * (u > .7 ? 2 : 1);
        bell(b.x, y, s * b.s, a);
        c.save(); c.translate(b.x + 26 * s, y - 40 * s); c.rotate(a * 1.5 + .2); c.fillStyle = 'rgba(240,232,210,.9)'; c.fillRect(0, 0, 24 * s, 34 * s);
        c.strokeStyle = 'rgba(80,60,40,.6)'; c.lineWidth = 1; for (let l = 1; l < 4; l++) { c.beginPath(); c.moveTo(3 * s, l * 8 * s); c.lineTo(20 * s, l * 8 * s); c.stroke(); } c.restore();
      }
    }
    for (let i = 0; i < 5; i++) { const x = 160 + i * 190; dot(x, 1560, 8, '#ffcf7a'); glow(x, 1550, 90, 'rgba(255,170,70,.4)'); }
  },
  7: (u, t) => { // a village that won't forgive Hanuman: the mountain with a piece missing
    sky(['#04060f', '#0b1430', '#162048']); stars(t); dot(830, 330, 40, '#e8eeff'); glow(830, 330, 200, 'rgba(180,200,255,.2)');
    c.fillStyle = '#1b2547'; c.beginPath(); c.moveTo(-20, 1300); c.lineTo(300, 640); c.lineTo(420, 700); c.lineTo(470, 560); c.lineTo(560, 700); c.lineTo(640, 600); c.lineTo(1100, 1300); c.fill();
    c.fillStyle = '#04060f'; c.beginPath(); c.moveTo(470, 560); c.lineTo(520, 640); c.lineTo(600, 650); c.lineTo(640, 600); c.lineTo(560, 540); c.closePath(); c.fill();
    c.setLineDash([12, 10]); c.strokeStyle = 'rgba(255,90,100,.8)'; c.lineWidth = 4; c.beginPath(); c.moveTo(470, 560); c.lineTo(520, 450); c.lineTo(620, 440); c.lineTo(660, 520); c.lineTo(640, 600); c.stroke(); c.setLineDash([]);
    ridge(1400, 160, '#0e1430', 4); for (const w of WINDOWS.slice(0, 12)) dot(w.x, w.y + 80, 5, '#ffcf7a');
    fog(t, 1300, 200, .2);
  },
  8: (u, t) => { // the devi's walk behind a four-horned ram; two calendars
    if (u < .62) {
      sky(['#04060f', '#0b1430', '#1b2450']); stars(t, .8);
      ridge(1250, 240, '#141c3c', 2.4); ridge(1450, 160, '#0b1028', 5);
      const k = prog(u, 0, .62);
      for (let i = 0; i < 14; i++) { const x = lerp(-200, 900, k) - i * 70, y = 1180 - Math.sin((x + 200) * .004) * 80; if (x < -40) continue; dot(x, y, 6, '#ffcf7a'); glow(x, y, 50, 'rgba(255,170,70,.45)'); person(x - 10, y + 60, .5, '#0a0e22'); }
      const rx = lerp(-60, 1000, k) + 90, ry = 1150 - Math.sin((rx + 200) * .004) * 80;
      c.save(); c.translate(rx, ry); c.fillStyle = '#d8d0bc'; c.beginPath(); c.ellipse(0, 0, 48, 28, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(46, -16, 18, 14, 0, 0, 7); c.fill();
      c.strokeStyle = '#b8945a'; c.lineWidth = 6; for (const [dx, r] of [[38, 12], [50, 10], [42, 16], [54, 14]]) { c.beginPath(); c.arc(dx, -30, r, Math.PI, Math.PI * 2.3); c.stroke(); }
      c.fillStyle = '#d8d0bc'; for (const lx of [-30, -14, 14, 30]) c.fillRect(lx, 20, 7, 30); c.restore();
      if (k > .4) { c.globalAlpha = prog(k, .4, .6); label(540, 920, 'चार सींगों वाला मेढ़ा', '#f2c46d', 30); c.globalAlpha = 1; }
    } else {
      sky(['#05070f', '#0c1022']); const k = eout(prog(u, .62, .8));
      for (const [x, d, col] of [[300, 'अगस्त?', '#f2c46d'], [780, 'सितंबर?', '#ff5a64']]) {
        c.save(); c.translate(x, 900); c.rotate(x < 540 ? -.06 : .06); c.scale(k, k);
        c.fillStyle = '#efe6d2'; c.beginPath(); c.roundRect(-170, -200, 340, 400, 18); c.fill(); c.fillStyle = col; c.fillRect(-170, -200, 340, 90);
        c.fillStyle = '#1a1a1a'; c.font = '60px Tiro'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(d, 0, 40); c.restore();
      }
      hiText(540, 1270, 'दो कमेटियाँ', 70, '#f3eee2', prog(u, .75, .85));
    }
  },
  9: (u, t) => { // a lake holding strangers' bones
    sky(['#03050d', '#0a1330', '#1c2a58']); stars(t);
    peak(560, 420, 520, 640, '#25335f', '#9aaedb'); ridge(1180, 200, '#1a2648', 1.7);
    c.fillStyle = '#2b3b68'; c.fillRect(0, 1180, W, 800);
    c.fillStyle = '#163f66'; c.beginPath(); c.ellipse(540, 1380, 380, 120, 0, 0, 7); c.fill();
    const R3 = rng(9); for (let i = 0; i < 26; i++) { const k = prog(u, .1 + i * .015, .3 + i * .015); if (!k) continue; const a = R3() * 7, r = Math.sqrt(R3()); const x = 540 + Math.cos(a) * 330 * r, y = 1380 + Math.sin(a) * 100 * r; c.globalAlpha = k; c.fillStyle = '#e9e0c8';
      if (i % 4 === 0) { dot(x, y, 14, '#e9e0c8'); dot(x - 5, y - 1, 3, '#3a3226'); dot(x + 5, y - 1, 3, '#3a3226'); } else { c.save(); c.translate(x, y); c.rotate(a); c.fillRect(-20, -3, 40, 6); dot(-20, 0, 6, '#e9e0c8'); dot(20, 0, 6, '#e9e0c8'); c.restore(); } c.globalAlpha = 1; }
    const k = eout(prog(u, .45, .85)); c.strokeStyle = '#3fe0d0'; c.lineWidth = 6; c.setLineDash([16, 12]); c.beginPath();
    for (let i = 0; i <= 50 * k; i++) { const v = i / 50, x = lerp(-40, 540, v), y = lerp(500, 1340, v) - Math.sin(v * Math.PI) * 380; i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); c.setLineDash([]);
    if (k > .3) { c.globalAlpha = prog(k, .3, .5); label(300, 560, 'दुनिया के उस पार से', '#3fe0d0', 28); c.globalAlpha = 1; }
    fog(t, 1250, 160, .18);
  },
  10: (u, t) => { // a mountain hiding a nuclear device
    sky(['#02030a', '#070d22', '#0f1838']); stars(t, .7);
    c.fillStyle = '#1c2850'; c.beginPath(); c.moveTo(-40, 1500); c.lineTo(540, 380); c.lineTo(1120, 1500); c.fill();
    c.fillStyle = '#c9d4f0'; c.beginPath(); c.moveTo(430, 600); c.lineTo(540, 380); c.lineTo(650, 600); c.lineTo(590, 560); c.lineTo(540, 620); c.lineTo(490, 560); c.fill();
    const cut = eout(prog(u, .1, .4)); c.save(); c.beginPath(); c.arc(540, 1020, 230 * cut, 0, 7); c.clip(); c.fillStyle = '#05070f'; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(90,120,200,.4)'; c.lineWidth = 2; for (let i = 0; i < 8; i++) { c.beginPath(); c.arc(540, 1020, 30 + i * 28, 0, 7); c.stroke(); }
    const pulse = .6 + .4 * Math.sin(t * 6); glow(540, 1020, 200, `rgba(150,255,120,${.35 * pulse})`);
    c.fillStyle = '#8a9a7a'; c.beginPath(); c.roundRect(490, 960, 100, 120, 14); c.fill(); c.fillStyle = '#3a4a2a'; c.fillRect(490, 990, 100, 14); c.fillRect(490, 1040, 100, 14);
    c.fillStyle = `rgba(200,255,150,${pulse})`; c.font = '700 54px "JetBrains Mono"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('☢', 540, 1022); c.restore();
