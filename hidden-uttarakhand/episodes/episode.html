<script>
const W = 1920, H = 1080, cv = document.getElementById('cv'), cx = cv.getContext('2d');
const V = !!new URLSearchParams(location.search).get('v'), vx = document.getElementById('vcv').getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x = clamp(x), x * x * (3 - 2 * x));
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- scene presets: which picture each music bed gets, and its time of day
const KIND = {
  campfire:'fire', vigil:'fire', jagar:'fire', jagarrise:'fire', jagarpeak:'fire',
  stillness:'night', night:'night', fog:'night', hollow:'night', stars:'night', suspense:'night', threat:'night', mystery:'night',
  suspicion:'night', sinking:'night', bench:'night', airi:'night', cold:'night', tender:'night',
  dawn:'day', summit:'day', morning:'day', meadow:'day', breakfast:'day', outdoor:'day', trek:'day', village:'day', flowers:'day',
  discovery:'day', heroic:'day', auli:'day', drone:'day',
  drive:'road', roadday:'road', roadnight:'road', airport:'road',
  temple:'temple', kedar:'temple', bells:'temple', petition:'temple', ghat:'temple', lore:'temple', legend:'temple', bahi:'temple',
  pandavlila:'temple', rajula:'temple', dorje:'temple',
  cave:'cave', roopkund:'lake', docu:'day',
  lobby:'room', dining:'room', police:'room', dhaba:'room', receipt:'room', code:'room', plan:'room', stall:'room', golu:'room',
  caper:'room', porch:'room', farewell:'road', flowers2:'day',
  chase:'storm', rockfall:'storm', storm:'storm', tension:'storm', diary:'diary',
};
const KIND_OWN = { };   // mood beds that should keep their own picture instead of inheriting
const TOD = { docu:'dawn', dawn:'dawn', summit:'dawn', heroic:'dawn', roadnight:'night', ghat:'night', lore:'dusk', legend:'dusk', rajula:'dusk',
              dorje:'dusk', pandavlila:'dusk', bells:'day', petition:'day', temple:'dusk', kedar:'dawn', farewell:'day', drive:'day',
              roadday:'day', airport:'day', bahi:'dusk' };
const SKY = {
  night: { top:'#050914', mid:'#0d1830', low:'#1a2a4a', ridge:['#1a2846','#142039','#0e182c','#090f1d'], snow:'#c4d2ea', mist:'rgba(150,175,215,', stars:1, moon:1 },
  dusk:  { top:'#0b1430', mid:'#2a3566', low:'#7c5e8c', ridge:['#3a3f6b','#2a2f55','#1c2140','#11152b'], snow:'#e7d9e8', mist:'rgba(210,190,225,', stars:.5, moon:.6 },
  dawn:  { top:'#16284f', mid:'#4b6aa3', low:'#e8b7b8', ridge:['#6d82b0','#4d6290','#344870','#1f2f50'], snow:'#fff3ef', mist:'rgba(240,225,235,', stars:.08, moon:0, sun:1 },
  day:   { top:'#2c5d97', mid:'#6fa0d0', low:'#c9e0ee', ridge:['#7fa3c4','#4f7f9e','#2f5f72','#1d4350'], snow:'#ffffff', mist:'rgba(235,245,250,', stars:0, moon:0, sun:.6 },
};

// precomputed landscape: ridge noise, stars, trees, per seed
const R = rng(7), STARS = Array.from({ length: 420 }, () => [R() * W * 1.3, R() * H * .62, R() * 1.6 + .3, R() * 6.28]);
function ridgeY(x, seed, base, amp, sharp) {
  let y = 0;
  const n = sharp ? 4 : 5;
  for (let k = 1; k <= n; k++) {
    const f = (sharp ? .0009 : .0013) * Math.pow(2.1, k - 1) * (1 + (seed * 37 % 7) * .03), p = seed * 13.7 * k;
    const s = Math.sin(x * f + p);
    y += (sharp ? (1 - Math.abs(s)) * 2 - 1 : s) * amp / Math.pow(k, sharp ? 1.15 : 1.4);
  }
  return base - y;
}
function ridge(c, seed, base, amp, color, off, sharp, snow, snowCol) {
  c.beginPath(); c.moveTo(-50, H);
  for (let x = -50; x <= W + 50; x += 8) c.lineTo(x, ridgeY(x + off, seed, base, amp, sharp));
  c.lineTo(W + 50, H); c.closePath();
  if (snow) {   // snow-lit peaks: the snowline fades down into the ridge's own colour
    const g = c.createLinearGradient(0, base - amp * 1.6, 0, base + amp * .3);
    g.addColorStop(0, snowCol); g.addColorStop(.3, snowCol); g.addColorStop(.55, color); g.addColorStop(1, color);
    c.fillStyle = g;
  } else c.fillStyle = color;
  c.fill();
}
function deodar(c, x, y, h, col) {
  c.fillStyle = col; c.beginPath();
  const w = h * .34;
  for (let k = 0; k < 5; k++) { const yy = y - h * (k / 5), ww = w * (1 - k / 6);
    c.moveTo(x - ww, yy); c.lineTo(x, yy - h * .34); c.lineTo(x + ww, yy); }
  c.fill(); c.fillRect(x - 3, y, 6, h * .08);
}
const TREES = Array.from({ length: 70 }, (_, i) => [i / 70 * W * 1.4 - 200 + R() * 30, R(), R()]);

function sky(c, P, t, cam) {
  const g = c.createLinearGradient(0, 0, 0, H * .8);
  g.addColorStop(0, P.top); g.addColorStop(.55, P.mid); g.addColorStop(1, P.low);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (P.stars) for (const [x, y, r, ph] of STARS) {
    const a = P.stars * (.45 + .55 * Math.sin(t * 1.3 + ph * 3));
    c.globalAlpha = clamp(a); c.fillStyle = '#eef3ff'; c.beginPath(); c.arc(((x - cam * .05) % (W * 1.3) + W * 1.3) % (W * 1.3) - 100, y, r, 0, 6.3); c.fill();
  }
  c.globalAlpha = 1;
  if (P.moon) {   // crescent moon with halo
    const mx = 1480 - cam * .08, my = 190;
    const hg = c.createRadialGradient(mx, my, 10, mx, my, 220); hg.addColorStop(0, 'rgba(220,230,255,.22)'); hg.addColorStop(1, 'rgba(220,230,255,0)');
    c.fillStyle = hg; c.beginPath(); c.arc(mx, my, 220, 0, 6.3); c.fill();
    c.save(); c.beginPath(); c.arc(mx, my, 46, 0, 6.3); c.clip();
    c.globalAlpha = P.moon; c.fillStyle = '#f2f5ff'; c.beginPath(); c.arc(mx, my, 46, 0, 6.3); c.arc(mx + 20, my - 12, 42, 0, 6.3, true); c.fill('evenodd');
    c.restore(); c.globalAlpha = 1;
  }
  if (P.sun) {
    const sx = 520 - cam * .06, sy = 520;
    const sg = c.createRadialGradient(sx, sy, 20, sx, sy, 520); sg.addColorStop(0, `rgba(255,240,225,${.75 * P.sun})`); sg.addColorStop(1, 'rgba(255,240,225,0)');
    c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, 520, 0, 6.3); c.fill();
  }
}
function mist(c, P, t, y0, k) {
  for (let i = 0; i < 4; i++) {
    const y = y0 + i * 60 + 14 * Math.sin(t * .2 + i), a = .08 * k * (.6 + .4 * Math.sin(t * .3 + i * 1.7));
    const g = c.createLinearGradient(0, y - 60, 0, y + 60);
    g.addColorStop(0, P.mist + '0)'); g.addColorStop(.5, P.mist + a + ')'); g.addColorStop(1, P.mist + '0)');
    c.fillStyle = g; c.fillRect(0, y - 60, W, 120);
  }
}
function particles(c, t, n, seed, col, fall, size) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, sp = 20 + r() * 50, sw = r() * 6.28;
    const y = ((y0 + t * sp * fall) % (H + 40) + H + 40) % (H + 40) - 20;
    const x = x0 + Math.sin(t * .6 + sw) * 30;
    c.globalAlpha = .35 + .5 * r(); c.fillStyle = col; c.beginPath(); c.arc(x, y, size * (.5 + r()), 0, 6.3); c.fill();
  }
  c.globalAlpha = 1;
}
function landscape(c, P, t, cam, opts = {}) {
  sky(c, P, t, cam);
  ridge(c, 3, 540, 190, P.ridge[0], cam * .15, true, true, P.snow);
  mist(c, P, t, 560, 1);
  ridge(c, 5, 700, 80, P.ridge[1], cam * .3, false);
  ridge(c, 9, 820, 60, P.ridge[2], cam * .5, false);
  if (opts.trees !== false) for (const [x, a, b] of TREES) {
    const xx = x - cam * .5;
    if (xx < -60 || xx > W + 60) continue;
    deodar(c, xx, ridgeY(x, 9, 820, 60, false) + 10, 60 + a * 70, P.ridge[3]);
  }

    if (h.fx === 'sting' || h.fx === 'drumhit') flash = Math.max(flash, .28 * Math.exp(-d * 6));
    if (h.fx === 'sting_light') flash = Math.max(flash, .12 * Math.exp(-d * 6));
    if (['crash', 'thud', 'rockfall', 'skid', 'boot', 'bonnet'].includes(h.fx)) shake = Math.max(shake, 14 * Math.exp(-d * 5));
    if (h.fx === 'heartbeat' && d < 22) pulse = Math.max(pulse, .5 + .5 * Math.sin(d * 6.7));
  }
  $('flash').style.opacity = flash; $('pulse').style.opacity = pulse * .8;
  (V ? $('vcv') : cv).style.transform = shake ? `translate(${Math.sin(t * 90) * shake}px, ${Math.cos(t * 70) * shake}px) scale(1.02)` : '';

  // --- the next-episode card over the closing theme
  const nk = ease((t - (D - 12)) / 1.2);
  $('next').style.opacity = EP.next ? nk : 0;
  if (EP.next) {
    $('nbk').style.transform = `rotateY(${-24 + 10 * Math.sin(t * .8)}deg) rotateX(6deg)`;
    const hk = EP.next.hook, n = Math.floor(hk.length * clamp((t - (D - 10.5)) / 3.5));
    $('nH').textContent = hk.slice(0, n);
    $('bell').style.transform = `rotate(${Math.sin(t * 14) * 18 * clamp((t - (D - 7)) / .3) * clamp((D - 5.5 - t) / .3)}deg)`;
  }
}
// static text
$('pLab').textContent = EP.label; $('pEn').textContent = EP.en; $('pDay').textContent = EP.title[3] ? EP.title[3].text.replace(/।\s*/g, ' · ') : '';
$('hLab').textContent = EP.label + (EP.name.startsWith('ch') ? ' · ' + EP.en : '');
$('place').textContent = EP.title[3] ? EP.title[3].text.replace(/।\s*/g, ' · ') : '';
if (EP.next) { $('nL').textContent = EP.next.label; $('nE').textContent = EP.next.en; }
window.render = render;
render(0);
</script>
</body>
</html>
