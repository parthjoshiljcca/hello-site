<script>
const B = {}; TIMELINE.beats.forEach(b => B[b.beat] = b);
const S = n => B[n].start, E = n => B[n].end, DURATION = TIMELINE.duration;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eout = x => 1 - Math.pow(1 - x, 3);
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const lerp = (a, b, k) => a + (b - a) * k;
const cv = document.getElementById('cv'), c = cv.getContext('2d');
const beatAt = t => (TIMELINE.beats.filter(b => t >= b.start - .2).pop() || TIMELINE.beats[0]).beat;

// ---------- the narration on top, word by word; the keyword big and green ----------
const KEY = { 1: 'सैकड़ों कंकाल', 2: 'रूपकुंड।', 3: 'जापानी सैनिक।', 4: 'कहीं ज़्यादा पुरानी', 5: 'मरे कैसे?', 6: 'क्रिकेट बॉल जितने ओले।',
  7: 'तीन अलग ग्रुप।', 8: 'ग्रीस और क्रीट', 9: 'एक हज़ार साल।', 10: 'आज तक कोई नहीं जानता।', 11: 'एक लाइन में,', 12: 'हिडन उत्तराखंड' };
const RED = { 3: 1 };
const say = document.getElementById('say');
function sentenceAt(t) { return TIMELINE.captions.filter(s => t >= s.start - .15).pop(); }
function words(cap, beat) {
  const ws = cap.text.split(' '), key = (KEY[beat] || '').split(' '), out = [];
  let i = 0;
  while (i < ws.length) {
    if (key[0] && ws.slice(i, i + key.length).join(' ') === key.join(' ')) { out.push({ k: true, text: key.join(' '), i }); i += key.length; }
    else { out.push({ k: false, text: ws[i], i }); i++; }
  }
  return { list: out, n: ws.length };
}
function narration(t) {
  const cap = sentenceAt(t);
  if (!cap || t > cap.end + 1.2 || beatAt(t) >= 11) { say.innerHTML = ''; say.dataset.k = ''; return; }
  const beat = TIMELINE.beats.find(b => cap.start >= b.start - .01 && cap.start <= b.end).beat, { list, n } = words(cap, beat);
  if (say.dataset.k !== String(cap.start)) {
    say.innerHTML = list.map(w => w.k ? `<span class="k${RED[beat] ? ' red' : ''}">${w.text}</span>` : `<span class="w">${w.text}</span>`).join(' ');
    say.dataset.k = cap.start;
  }
  [...say.children].forEach((el, j) => {
    const at = cap.start + (cap.end - cap.start) * list[j].i / n, k = prog(t, at - .05, at + .2);
    el.style.opacity = eout(k);
    el.style.transform = list[j].k ? `scale(${lerp(1.25, 1, back(k))})` : `translateY(${(1 - eout(k)) * 16}px)`;
  });
}

// ---------- drawing helpers ----------
function pill(x, y, text, bg = '#1d2321', fg = '#fff', size = 28, mono = true) {
  c.font = `${mono ? '700' : '800'} ${size}px ${mono ? "'JetBrains Mono', monospace" : 'Mukta'}`;
  const w = c.measureText(text).width + size * 1.2, h = size * 1.7;
  c.fillStyle = bg; c.beginPath(); c.roundRect(x - w / 2, y - h / 2, w, h, h / 2); c.fill();
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y + (mono ? 0 : 3));
}
function dot(x, y, r, col) { if (!(r > 0)) return; c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
function proj(box) { return ([lon, lat]) => [(lon - box[0]) / (box[2] - box[0]) * 900, (box[3] - lat) / (box[3] - box[1]) * 900]; }
function dots(list, P, col, r = 3.6) { c.fillStyle = col; for (const d of list) { const [x, y] = P(d); c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); } }
function arcPath(P, a, b, k, col, lift = .25, w = 6, dash = null) {
  const [x0, y0] = P(a), [x1, y1] = P(b), mx = (x0 + x1) / 2, my = (y0 + y1) / 2 - Math.hypot(x1 - x0, y1 - y0) * lift;
  c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.setLineDash(dash || []); c.beginPath();
  for (let i = 0; i <= 60 * k; i++) { const u = i / 60, x = (1 - u) ** 2 * x0 + 2 * u * (1 - u) * mx + u * u * x1, y = (1 - u) ** 2 * y0 + 2 * u * (1 - u) * my + u * u * y1; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke(); c.setLineDash([]);
  if (k > 0 && k < 1) { const u = k, x = (1 - u) ** 2 * x0 + 2 * u * (1 - u) * mx + u * u * x1, y = (1 - u) ** 2 * y0 + 2 * u * (1 - u) * my + u * u * y1; dot(x, y, w * 1.6, col); }
}
function pin(x, y, k, col = '#14804f') {
  if (k <= 0) return; const s = back(k), yy = y - (1 - eout(k)) * 60;
  c.save(); c.translate(x, yy); c.scale(s, s);
  c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(0, 4, 14, 5, 0, 0, 7); c.fill();
  c.fillStyle = col; c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-22, -26, -22, -56, 0, -56); c.bezierCurveTo(22, -56, 22, -26, 0, 0); c.fill();
  dot(0, -38, 8, '#fff'); c.restore();
}
const ROOP = GEO.places.roopkund;
const IND = proj([66.5, 6, 98.5, 38]), ASIA = proj([58, 2, 150, 54]), WORLD = proj([8, -5, 138, 60]);
const asiaDots = GEO.globe.filter(([lo, la]) => lo > 56 && lo < 152 && la > 0 && la < 56), worldDots = GEO.globe.filter(([lo, la]) => lo > 6 && lo < 140 && la > -7 && la < 62);
function mountains(u, bones) {
  c.fillStyle = '#dfeaf3'; c.fillRect(0, 0, 900, 900);
  const ridge = (base, amp, col, seed) => { c.fillStyle = col; c.beginPath(); c.moveTo(0, 900); for (let x = 0; x <= 900; x += 30) c.lineTo(x, base - amp * Math.abs(Math.sin(x * .011 + seed) * Math.cos(x * .004 + seed * 2))); c.lineTo(900, 900); c.fill(); };
  ridge(470, 300, '#b9c8da', 1); ridge(560, 220, '#93a7c0', 3);
  c.fillStyle = '#fff'; for (const [x, y] of [[300, 210], [610, 260]]) { c.beginPath(); c.moveTo(x - 60, y + 70); c.lineTo(x, y); c.lineTo(x + 60, y + 70); c.lineTo(x + 25, y + 55); c.lineTo(x, y + 75); c.lineTo(x - 25, y + 55); c.fill(); }
  c.fillStyle = '#eef3f7'; c.beginPath(); c.moveTo(0, 900); c.lineTo(0, 620); c.quadraticCurveTo(450, 540, 900, 620); c.lineTo(900, 900); c.fill();
  c.fillStyle = '#7fb3d5'; c.beginPath(); c.ellipse(450, 720, 260, 90, 0, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(420, 700, 180, 40, 0, 0, 7); c.fill();
  for (let i = 0; i < 22; i++) {
    const k = eout(prog(u, .15 + i * .02, .35 + i * .02)); if (k <= 0) continue;
    const x = 450 + Math.cos(i * 2.4) * 200 * Math.sqrt((i % 7 + 1) / 7), y = 720 + Math.sin(i * 2.4) * 60 * Math.sqrt((i % 7 + 1) / 7);
    c.globalAlpha = k; c.fillStyle = '#f4ecd6'; c.strokeStyle = '#b8a888'; c.lineWidth = 2;
    if (i % 4 === 0) { c.beginPath(); c.ellipse(x, y, 13, 11, 0, 0, 7); c.fill(); c.stroke(); dot(x - 4, y - 1, 2.5, '#5a5040'); dot(x + 4, y - 1, 2.5, '#5a5040'); }
    else { c.save(); c.translate(x, y); c.rotate(i); c.fillRect(-16, -3, 32, 6); dot(-16, 0, 5, '#f4ecd6'); dot(16, 0, 5, '#f4ecd6'); c.restore(); }
    c.globalAlpha = 1;
  }
}

// ---------- the cards, one per beat ----------
const CARD = {
  1: u => { mountains(u); pill(700, 90, '5,029 m'); },
  2: u => {
    c.fillStyle = '#eef4fb'; c.fillRect(0, 0, 900, 900);
    for (const d of GEO.india) { const [x, y] = IND(d); dot(x, y, 4.2, d[2] ? '#14804f' : '#9fb6cf'); }
    const [x, y] = IND(ROOP); pin(x, y, prog(u, .25, .55)); if (u > .5) pill(x + 30, y - 120, 'रूपकुंड · चमोली', '#14804f', '#fff', 34, false);
  },
  3: u => {
    c.fillStyle = '#eef4fb'; c.fillRect(0, 0, 900, 900); dots(asiaDots, ASIA, '#a9bdd4', 4);
    const [rx, ry] = ASIA(ROOP), [jx, jy] = ASIA(GEO.places.japan);
    dot(jx, jy, 12, '#d93a3a'); pill(jx - 20, jy + 50, 'JAPAN', '#d93a3a', '#fff', 22);
    arcPath(ASIA, GEO.places.japan, ROOP, eout(prog(u, .45, .85)), '#d93a3a', .3, 7, [18, 14]);
    pin(rx, ry, prog(u, .05, .3)); pill(130, 80, '1942');
  },
  4: u => {
    c.fillStyle = '#fff'; c.fillRect(0, 0, 900, 900);
    c.font = '800 96px Mukta'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#1d2321'; c.fillText('जापानी सैनिक', 450, 380);
    const k = eout(prog(u, .1, .35)); c.strokeStyle = '#d93a3a'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(150, 390); c.lineTo(150 + 600 * k, 390); c.stroke();
    const s = prog(u, .5, .62); if (s > 0) { c.save(); c.translate(450, 590); c.rotate(-.12); c.scale(lerp(1.8, 1, eout(s)), lerp(1.8, 1, eout(s))); c.globalAlpha = s;
      c.strokeStyle = '#14804f'; c.lineWidth = 8; c.strokeRect(-230, -70, 460, 140); c.fillStyle = '#14804f'; c.font = '800 76px Mukta'; c.fillText('बहुत पुरानी', 0, 8); c.restore(); }
  },
  5: u => {
    c.fillStyle = '#f7faf8'; c.fillRect(0, 0, 900, 900);
    const p = 1 + .04 * Math.sin(u * 20); dot(450, 450, 230 * p * back(prog(u, 0, .35)), '#14804f');
    c.fillStyle = '#fff'; c.font = '800 300px Mukta'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.globalAlpha = prog(u, .1, .3); c.fillText('?', 450, 480); c.globalAlpha = 1;
  },
  6: u => {
    c.fillStyle = '#fff'; c.fillRect(0, 0, 900, 900);
    const sk = 1 - prog(u, .5, .58), hb = prog(u, .55, .7);
    if (sk > 0) {
      c.globalAlpha = sk; c.save(); c.translate(450, 470);
      c.fillStyle = '#f2ead6'; c.strokeStyle = '#8f8064'; c.lineWidth = 6;
      c.beginPath(); c.ellipse(0, -40, 220, 200, 0, Math.PI * .95, Math.PI * 2.05); c.lineTo(150, 120); c.lineTo(80, 190); c.lineTo(-80, 190); c.lineTo(-150, 120); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#3a3226'; for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * 80, 40, 55, 48, 0, 0, 7); c.fill(); }
      c.beginPath(); c.moveTo(0, 90); c.lineTo(-22, 140); c.lineTo(22, 140); c.fill();
      for (let i = -3; i <= 3; i++) c.fillRect(i * 22 - 8, 165, 16, 26);
      const ck = eout(prog(u, .12, .32)); c.strokeStyle = '#d93a3a'; c.lineWidth = 8; c.beginPath();
      const crack = [[-10, -235], [10, -190], [-12, -150], [16, -110], [0, -80]]; crack.slice(0, 1 + Math.round(ck * 4)).forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke();
      if (ck > .5) { c.fillStyle = '#d93a3a'; c.beginPath(); c.moveTo(-40, -330); c.lineTo(40, -330); c.lineTo(0, -270); c.fill(); }
      c.restore(); c.globalAlpha = 1;
    }
    if (hb > 0) {
      c.globalAlpha = hb;
      c.fillStyle = '#d9ecfb'; c.strokeStyle = '#7fb3d5'; c.lineWidth = 6; c.beginPath();
      for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, r = 120 + (i % 2) * 14; c.lineTo(240 + Math.cos(a) * r, 450 + Math.sin(a) * r); } c.closePath(); c.fill(); c.stroke();
      dot(660, 450, 125, '#b3202c'); c.strokeStyle = '#fff'; c.lineWidth = 6; c.beginPath(); c.arc(660, 450, 125, -1.2, 1.2); c.stroke(); c.beginPath(); c.arc(660, 450, 100, -1.1, 1.1); c.stroke();
      c.fillStyle = '#1d2321'; c.font = '800 110px Mukta'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('≈', 450, 460);
      pill(240, 650, 'ओला', '#7fb3d5', '#fff', 32, false); pill(660, 650, 'क्रिकेट बॉल', '#b3202c', '#fff', 32, false);
      c.globalAlpha = 1;
    }
    pill(140, 80, '2004');
  },
  7: u => {
    c.fillStyle = '#fbfaf6'; c.fillRect(0, 0, 900, 900);
    const k = ease(prog(u, .5, .85)), cols = ['#c8901a', '#1a9a92', '#7a5bd6'], kinds = [...Array(23).fill(0), ...Array(14).fill(1), 2];
    kinds.forEach((kd, i) => {
      const gi = kinds.slice(0, i).filter(x => x === kd).length;
      const fx = 165 + (i % 7) * 95, fy = 220 + Math.floor(i / 7) * 95;
      const tx = [130, 520, 790][kd] + (kd === 2 ? 0 : (gi % 4) * 70), ty = 250 + Math.floor(gi / 4) * 70 * (kd === 2 ? 0 : 1);
      dot(lerp(fx, tx, k), lerp(fy, ty, k), 26 * back(prog(u, i * .008, i * .008 + .15)), k > .1 ? cols[kd] : '#c4c9c6');
    });
    if (k > .9) { [['23', 235, 760], ['14', 625, 760], ['1', 790, 760]].forEach(([n, x, y], j) => { c.fillStyle = cols[j]; c.font = '800 90px Mukta'; c.textAlign = 'center'; c.fillText(n, x, y); }); }
    pill(140, 80, '2019 · DNA');

  8: u => {
    c.fillStyle = '#eef4fb'; c.fillRect(0, 0, 900, 900); dots(worldDots, WORLD, '#b3c4d8', 3.4);
    const P = GEO.places, [rx, ry] = WORLD(ROOP);
    arcPath(WORLD, P.delhi, ROOP, eout(prog(u, .02, .2)), '#c8901a', .6, 9);

    arcPath(WORLD, P.seAsia, ROOP, eout(prog(u, .6, .85)), '#7a5bd6', .4, 9);

  },
  9: u => {
    c.fillStyle = '#fbfaf6'; c.fillRect(0, 0, 900, 900);
    c.fillStyle = '#d9ddda'; c.beginPath(); c.roundRect(100, 446, 700, 12, 6); c.fill();
    const a = back(prog(u, .1, .3)), b = back(prog(u, .3, .5)), g = eout(prog(u, .55, .9));
    dot(180, 452, 34 * a, '#c8901a'); dot(720, 452, 34 * b, '#1a9a92');
    if (a > .5) pill(180, 540, '~800 CE', '#c8901a', '#fff', 28); if (b > .5) pill(720, 540, '~1800 CE', '#1a9a92', '#fff', 28);
    c.strokeStyle = '#14804f'; c.lineWidth = 8; c.lineCap = 'round'; c.beginPath(); c.moveTo(180, 360); c.lineTo(180 + 540 * g, 360); c.stroke();
    if (g > .95) { c.fillStyle = '#14804f'; c.font = '800 84px Mukta'; c.textAlign = 'center'; c.fillText('1,000 साल', 450, 300); }
  },
  10: u => {
    if (u < .45) {

      c.strokeStyle = '#c8901a'; c.lineWidth = 9; c.setLineDash([22, 16]); c.lineCap = 'round'; c.beginPath();
      const pts = [[80, 860], [260, 780], [520, 760], [650, 640], [610, 470], [700, 330]]; const n = 1 + k * (pts.length - 1);
      for (let i = 0; i < n; i++) { const p = pts[Math.min(pts.length - 1, Math.floor(i))]; i ? c.lineTo(...p) : c.moveTo(...p); } c.stroke(); c.setLineDash([]);
      pill(450, 90, 'नंदा देवी राजजात', '#c8901a', '#fff', 36, false);
    } else {
      c.fillStyle = '#eef4fb'; c.fillRect(0, 0, 900, 900); dots(worldDots, WORLD, '#b3c4d8', 3.4);
      const pulse = .6 + .4 * Math.sin(u * 40); c.globalAlpha = pulse; arcPath(WORLD, GEO.places.crete, ROOP, 1, '#1a9a92', .3, 10); c.globalAlpha = 1;
      const [rx, ry] = WORLD(ROOP); pin(rx, ry, 1);
      const q = back(prog(u, .55, .7)); c.save(); c.translate(450, 300); c.scale(q, q); dot(0, 0, 110, '#14804f'); c.fillStyle = '#fff'; c.font = '800 160px Mukta'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, 14); c.restore();
    }

};

const one = document.getElementById('one'), bookEl = document.getElementById('book');
function render(t) {
  const n = beatAt(t), u = prog(t, n === 1 ? 0 : S(n) - .2, E(n));
  // the card pops in on every beat
  const inK = prog(t, n === 1 ? 0 : S(n) - .2, (n === 1 ? 0 : S(n) - .2) + .3), card = document.getElementById('card');
  card.style.transform = `translateY(${(1 - eout(inK)) * 40}px) scale(${lerp(.94, 1, back(inK))})`;
  card.style.opacity = n === 1 ? prog(t, .2, .6) : 1;
  one.style.display = n === 11 ? 'block' : 'none'; bookEl.style.display = n === 12 ? 'block' : 'none'; cv.style.display = n >= 11 ? 'none' : 'block';
  if (CARD[n]) { c.clearRect(0, 0, 900, 900); CARD[n](u); }
  if (n === 11) [...one.querySelectorAll('p > span')].forEach((s, i) => { const k = prog(t, S(11) + .9 + i * .55, S(11) + 1.2 + i * .55); s.style.color = k > 0 ? '#1d2321' : ''; s.style.opacity = .35 + .65 * k; });
  document.body.style.background = [11, 12].includes(n) ? '#e6f0ea' : n % 2 ? '#f2efe7' : '#eaf1ec';
  const lg = prog(t, S(12) + .4, S(12) + 1); document.getElementById('logo').style.opacity = eout(lg);
  document.getElementById('logo').style.transform = `scale(${lerp(1.2, 1, eout(lg))})`;
  document.getElementById('handle').style.opacity = n === 12 ? 0 : 1;
  document.getElementById('follow').style.opacity = eout(prog(t, S(12) + 3.2, S(12) + 3.6));
  narration(t);
  if (n === 11) { say.innerHTML = '<span class="k" style="opacity:1">एक लाइन में:</span>'; say.dataset.k = 'one'; }
  if (n === 12) { say.innerHTML = '<span class="w" style="opacity:1">ऐसी ही अनकही कहानियाँ</span>'; say.dataset.k = 'book'; }
  document.body.style.opacity = Math.min(prog(t, 0, .3) * 0 + 1, 1 - prog(t, DURATION - .6, DURATION));
}
window.ready = Promise.all([document.fonts.ready, new Promise(r => { const i = document.querySelector('.cover'); i.complete ? r() : (i.onload = r); })]);
