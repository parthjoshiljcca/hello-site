<script>

const W=1080,H=1920,FPS=30;
let D=null,TOT=30;
const OR='#ff8a1f',WH='#f3ece4',CARD='#f3ece4',INK='#0d0a08';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ctx=document.getElementById('c').getContext('2d');
const E=n=>D.ev[n];
const pop=(t,n,d=0.45,off=-0.08)=>back(seg(t,E(n)+off,E(n)+off+d));
const fin=(t,n,d=0.5,off=-0.08)=>eo(seg(t,E(n)+off,E(n)+off+d));

const SC=[
 {pill:'01 · HOOK',title:'Roz <em>Scan</em> Karte Ho',sub:'Payment · Menu · Website',tag:'QR · EVERYDAY'},
 {pill:'02 · SAWAAL',title:'Itni Info <em>Kaise?</em>',sub:'Ek chhota black & white square',tag:'INFORMATION · STORAGE'},

 {pill:'05 · AAJ',title:'Duniya <em>Bhar</em> Mein',sub:'Har jagah, har din',tag:'GLOBAL · USE'},
 {pill:'06 · HOW',title:'Kaam <em>Kaise</em> Karta Hai?',sub:'Dhyaan se dekho',tag:'ZOOM · IN'},

 {pill:'08 · SCAN',title:'Camera <em>Capture</em>',sub:'Pattern ki photo',tag:'CAMERA · CAPTURE'},

 {pill:'12 · TWIST',title:'Damage, Phir Bhi <em>Scan!</em>',sub:'Scratch ho ya logo',tag:'PLOT · TWIST'},

 {pill:'14 · DATA',title:'Sirf <em>Website</em> Nahi',sub:'Text · Contact · Wi-Fi · Payment',tag:'DATA · TYPES'},
 {pill:'15 · SOCHO',title:'Roz Dekhte, <em>Samajhte</em> Nahi',sub:'Math + Binary + Encoding + Error Correction',tag:'THE WHY'},
];

// ---------- background ----------
const grains=[];for(let k=0;k<4;k++){const g=document.createElement('canvas');g.width=g.height=256;const gx=g.getContext('2d');const id=gx.createImageData(256,256);const r=rng(k+7);for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=14}gx.putImageData(id,0,0);grains.push(gx.createPattern(g,'repeat'))}
function bg(t){
 ctx.fillStyle='#0a0807';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,170,110,0.028)';ctx.lineWidth=1;ctx.beginPath();
 for(let x=0;x<=W;x+=60){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}for(let y=0;y<=H;y+=60){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}ctx.stroke();
 const gx=540+Math.sin(t*.4)*60, gy=1000+Math.cos(t*.3)*40;
 let g=ctx.createRadialGradient(gx,gy,0,gx,gy,620);g.addColorStop(0,'rgba(255,120,20,0.20)');g.addColorStop(.5,'rgba(255,100,10,0.06)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 g=ctx.createRadialGradient(540,300,0,540,300,500);g.addColorStop(0,'rgba(255,120,20,0.07)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const r=rng(3);for(let i=0;i<60;i++){const x=(r()*W+t*(10+r()*20))%W,y=(r()*H-t*(15+r()*25)+H*50)%H;ctx.fillStyle=`rgba(255,190,140,${0.15+0.35*r()*(0.5+0.5*Math.sin(t*2+i))})`;ctx.beginPath();ctx.arc(x,y,1+r()*2,0,7);ctx.fill()}
}
function grain(f){ctx.save();ctx.fillStyle=grains[f%4];ctx.translate((f*37)%256,(f*91)%256);ctx.fillRect(-256,-256,W+512,H+512);ctx.restore();
 const v=ctx.createRadialGradient(540,960,500,540,960,1200);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.65)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}

// ---------- primitives ----------
function gs(w,col,blur){ctx.lineWidth=w;ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=blur||0;ctx.stroke();ctx.shadowBlur=0}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function txt(s,x,y,font,col,align='center',glow){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow}ctx.fillText(s,x,y);ctx.shadowBlur=0}
function badge(x,y,s,p,opt={}){if(p<=0)return;ctx.save();ctx.globalAlpha*=cl(p*1.5);ctx.translate(x,y);ctx.scale(p,p);const fs=opt.fs||32;ctx.font=`800 ${fs}px M`;const w=ctx.measureText(s).width+fs*1.5;rr(-w/2,-fs,w,fs*2,fs);ctx.fillStyle=opt.fill||'rgba(255,138,31,.14)';ctx.fill();gs(2.5,OR,16);txt(s,0,2,`800 ${fs}px M`,opt.col||'#ffb15c');ctx.restore()}
function monoTag(x,y,s,a){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.font='500 22px J';const w=ctx.measureText(s).width+30;rr(x-w/2,y-20,w,40,8);ctx.fillStyle='rgba(255,138,31,.10)';ctx.fill();ctx.strokeStyle='rgba(255,138,31,.6)';ctx.lineWidth=1.5;ctx.stroke();txt(s,x,y+1,'500 22px J','#ff9b3d');ctx.restore()}
function card(x,y,w,h,p,label,icon){if(p<=0)return;ctx.save();ctx.globalAlpha*=cl(p*1.4);ctx.translate(x,y);ctx.scale(p,p);rr(-w/2,-h/2,w,h,22);ctx.fillStyle='rgba(22,15,11,.92)';ctx.fill();gs(2.5,'rgba(255,138,31,.75)',18);
 if(icon){ctx.save();ctx.translate(-w/2+50,0);icon();ctx.restore()}txt(label,icon?-w/2+92:0,2,'800 30px M',WH,icon?'left':'center');ctx.restore()}
// icons (centered at 0,0, ~44px)
const IC={
 rupee:()=>txt('₹',0,2,'900 46px M',OR),
 menu:()=>{ctx.strokeStyle=OR;ctx.lineWidth=4;ctx.lineCap='round';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-18,i*13);ctx.lineTo(18,i*13);ctx.stroke()}},
 globe:()=>{ctx.strokeStyle=OR;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,9,20,0,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.stroke()},
 text:()=>txt('Aa',0,2,'900 34px M',OR),
 person:()=>{ctx.fillStyle=OR;ctx.beginPath();ctx.arc(0,-9,10,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(0,15,17,10,0,Math.PI,0);ctx.fill()},
 wifi:()=>{ctx.strokeStyle=OR;ctx.lineWidth=4;ctx.lineCap='round';for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(0,12,i*9,-Math.PI*0.75,-Math.PI*0.25);ctx.stroke()}ctx.fillStyle=OR;ctx.beginPath();ctx.arc(0,12,3.5,0,7);ctx.fill()},
 dots:()=>txt('+',0,0,'900 44px M',OR),
};
// ---------- QR ----------
let QN=25;
function isFinder(r,c){const n=QN;return (r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7)}
const modR=[];
// o: reveal, finder(glow), scramble, damage(fn r,c->bool), repair, logo, scan(0..1 row), scanned tint, rot, zoomRegion
function qr(cx,cy,size,o={}){
 const n=QN,pad=2,m=size/(n+pad*2);
 ctx.save();ctx.translate(cx,cy);if(o.rot)ctx.rotate(o.rot);
 const half=size/2;
 if(o.glow){ctx.shadowColor=OR;ctx.shadowBlur=60*o.glow}
 rr(-half,-half,size,size,size*0.05);ctx.fillStyle=CARD;ctx.fill();ctx.shadowBlur=0;
 const x0=-half+pad*m,y0=-half+pad*m;
 const rev=o.reveal==null?1:o.reveal;
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){
  const k=r*n+c;const th=modR[k];
  if(th>rev)continue;
  let v=D.qr[r][c];
  if(o.scramble&&th<o.scramble*1.05&&!isFinder(r,c))v=(Math.sin(k*91.7+Math.floor(o.st||0))>0)?1:0;
  let dmg=o.damage&&o.damage(r,c);
  if(dmg){const rp=o.repair||0;if(th*0.9+0.05>rp){ if(o.ghost){ctx.strokeStyle='rgba(255,138,31,.55)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.strokeRect(x0+c*m+2,y0+r*m+2,m-4,m-4);ctx.setLineDash([])} continue}
    else if(v){ctx.fillStyle=OR;ctx.fillRect(x0+c*m,y0+r*m,m+.5,m+.5);continue}}
  if(!v)continue;
  let col=INK;
  if(o.finder&&isFinder(r,c))col=`rgb(${lerp(13,255,o.finder)|0},${lerp(10,138,o.finder)|0},${lerp(8,31,o.finder)|0})`;
  if(o.scan!=null&&r/n<o.scan&&o.scanTint)col='#c45a0a';
  if(o.regions){const tm=(r===6||c===6)&&!isFinder(r,c);if(tm)col=`rgb(${lerp(13,230,o.regions)|0},${lerp(10,110,o.regions)|0},${lerp(8,20,o.regions)|0})`}
  const ap=o.popIn?cl((rev-th)*8):1;
  const s=m*ap;ctx.fillStyle=col;ctx.fillRect(x0+c*m+(m-s)/2,y0+r*m+(m-s)/2,s+.5,s+.5);
 }
 if(o.scratch>0){ctx.save();ctx.beginPath();rr(-half,-half,size,size,size*0.05);ctx.clip();const r=rng(77);ctx.lineCap='round';
  for(let i=0;i<9;i++){const p=cl(o.scratch*9-i);if(p<=0)continue;const sx=-half*0.2+i*12-40,sy=half*0.05+i*10;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+lerp(0,half*1.1,p),sy+lerp(0,half*0.9,p));ctx.strokeStyle='#e9ded1';ctx.lineWidth=14+r()*10;ctx.stroke();ctx.strokeStyle='rgba(140,120,100,.5)';ctx.lineWidth=2;ctx.stroke()}ctx.restore()}
 if(o.logo>0){const p=o.logo;ctx.save();ctx.scale(p,p);ctx.beginPath();ctx.arc(0,0,size*0.13,0,7);ctx.fillStyle=CARD;ctx.fill();ctx.beginPath();ctx.arc(0,0,size*0.105,0,7);const g=ctx.createRadialGradient(-10,-10,0,0,0,size*0.11);g.addColorStop(0,'#ffa94d');g.addColorStop(1,'#ff7a00');ctx.fillStyle=g;ctx.fill();txt('?',0,size*0.008,`900 ${size*0.13}px M`,'#1a0f06');ctx.restore()}
 if(o.scan!=null&&o.scanLine!==false&&o.scan>0&&o.scan<1){const y=-half+size*o.scan;const g=ctx.createLinearGradient(0,y-60,0,y);g.addColorStop(0,'rgba(255,138,31,0)');g.addColorStop(1,'rgba(255,138,31,.45)');ctx.fillStyle=g;ctx.fillRect(-half-10,y-60,size+20,60);ctx.beginPath();ctx.moveTo(-half-20,y);ctx.lineTo(half+20,y);gs(4,OR,24)}
 ctx.restore();
 return {m,x0:cx-half+pad*m,y0:cy-half+pad*m};
}
function viewfinder(cx,cy,s,a,t){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;const h=s/2,l=s*0.18;ctx.lineCap='round';
 const pulse=1+0.03*Math.sin(t*5);ctx.translate(cx,cy);ctx.scale(pulse,pulse);
 for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){ctx.beginPath();ctx.moveTo(sx*h,sy*(h-l));ctx.lineTo(sx*h,sy*h);ctx.lineTo(sx*(h-l),sy*h);gs(7,OR,18)}ctx.restore()}
function phone(cx,cy,w,h,a,screenFn){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(cx,cy);
 rr(-w/2,-h/2,w,h,52);ctx.fillStyle='rgba(16,12,9,.96)';ctx.fill();gs(4,'rgba(243,236,228,.9)');
 rr(-w/2+16,-h/2+16,w-32,h-32,40);ctx.fillStyle='#120d0a';ctx.fill();ctx.strokeStyle='rgba(255,138,31,.25)';ctx.lineWidth=2;ctx.stroke();
 rr(-50,-h/2+28,100,22,11);ctx.fillStyle='#000';ctx.fill();
 if(screenFn){ctx.save();rr(-w/2+16,-h/2+16,w-32,h-32,40);ctx.clip();screenFn();ctx.restore()}
 ctx.restore()}
function gear(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(let i=0;i<16;i++){const a=i/16*Math.PI*2;const R=i%2?r*0.78:r;ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R)}ctx.closePath();ctx.fillStyle='#2a201a';ctx.fill();gs(3,'rgba(243,236,228,.85)');ctx.beginPath();ctx.arc(0,0,r*0.3,0,7);gs(3,OR,8);ctx.restore()}
function miniQR(x,y,s){ctx.save();ctx.translate(x-s/2,y-s/2);ctx.fillStyle=CARD;ctx.fillRect(0,0,s,s);const m=s/(QN+2);ctx.fillStyle=INK;for(let r=0;r<QN;r++)for(let c=0;c<QN;c++)if(D.qr[r][c])ctx.fillRect(m+c*m,m+r*m,m+.3,m+.3);ctx.restore()}
function star(x,y,r,a){ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.beginPath();for(let i=0;i<8;i++){const rr2=i%2?r*.28:r;const an=i/8*Math.PI*2;ctx.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2)}ctx.closePath();ctx.fillStyle='#ffb15c';ctx.shadowColor=OR;ctx.shadowBlur=20;ctx.fill();ctx.restore()}
function check(x,y,s,p,col=OR){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.beginPath();const L1=[-0.5*s,0,-0.15*s,0.35*s],L2=[-0.15*s,0.35*s,0.55*s,-0.4*s];const q1=cl(p*2),q2=cl(p*2-1);ctx.moveTo(L1[0],L1[1]);ctx.lineTo(lerp(L1[0],L1[2],q1),lerp(L1[1],L1[3],q1));if(q2>0)ctx.lineTo(lerp(L2[0],L2[2],q2),lerp(L2[1],L2[3],q2));ctx.lineCap='round';ctx.lineJoin='round';gs(s*0.14,col,20);ctx.restore()}
function line(x1,y1,x2,y2,p,col='rgba(255,138,31,.6)',w=2.5){if(p<=0)return;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p));ctx.setLineDash([6,8]);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();ctx.setLineDash([])}
function dottedSphere(cx,cy,R,t,a,pins){ctx.save();ctx.globalAlpha*=a;const rot=t*0.35;
