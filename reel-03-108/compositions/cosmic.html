  <script>
    // Deterministic star field (seeded), drawn once.
    (function () {
      const c = document.querySelector("#co-stars");
      const ctx = c.getContext("2d");
      let s = 108;
      const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const g = ctx.createLinearGradient(0, 0, 2160, 3840);
      g.addColorStop(0, "#03040a"); g.addColorStop(0.5, "#060a16"); g.addColorStop(1, "#020308");
      ctx.fillStyle = g; ctx.fillRect(0, 0, 2160, 3840);
      for (let i = 0; i < 1400; i++) {
        const x = rnd() * 2160, y = rnd() * 3840, r = rnd() < 0.94 ? 0.6 + rnd() * 1.6 : 2.2 + rnd() * 2;
        const a = 0.25 + rnd() * 0.7, warm = rnd() < 0.2;
        ctx.fillStyle = warm ? `rgba(255,226,190,${a})` : `rgba(210,225,255,${a})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    })();

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#co-stars", { scale: 1.08 }, { scale: 1.0, duration: 13.1, ease: "none" }, 0);
    tl.fromTo("#co-stars", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out" }, 0);

    // Part A — Sun drifts in, Earth appears, 108 dots run from Earth to Sun.

    tl.fromTo("#co-sun img", { rotation: 0 }, { rotation: 4, duration: 8.4, ease: "none" }, 0);
    tl.fromTo("#co-earth1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 1.6);
    tl.fromTo("#co-line1", { clipPath: "inset(100% 0 0 0)" },
      { clipPath: "inset(0% 0 0 0)", duration: 3.0, ease: "power1.inOut" }, 3.4);
    tl.fromTo("#co-l1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.4);
    const n1 = { v: 0 };
    tl.to(n1, { v: 108, duration: 3.0, ease: "power1.inOut",
      onUpdate: () => { document.querySelector("#co-n1").textContent = Math.round(n1.v); } }, 3.4);
    tl.to("#co-a", { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.9);

    // Part B — Earth and Moon.
    tl.fromTo("#co-b", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, 8);
    tl.fromTo("#co-earth2", { scale: 1.06, y: 40 }, { scale: 1, y: 0, duration: 5.1, ease: "sine.out" }, 8);
    tl.fromTo("#co-moon", { scale: 0.9 }, { scale: 1, duration: 5.1, ease: "sine.out" }, 8);
    tl.fromTo("#co-line2", { clipPath: "inset(100% 0 0 0)" },
      { clipPath: "inset(0% 0 0 0)", duration: 2.6, ease: "power1.inOut" }, 8.6);
    tl.fromTo("#co-l2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 8.6);
    const n2 = { v: 0 };
    tl.to(n2, { v: 108, duration: 2.6, ease: "power1.inOut",
      onUpdate: () => { document.querySelector("#co-n2").textContent = Math.round(n2.v); } }, 8.6);
    tl.fromTo("#co-note", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 9.9);
    window.__timelines["cosmic"] = tl;
  </script>
