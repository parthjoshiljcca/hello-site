<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #020205; }
    #cl-stars { position: absolute; left: 0; top: 0; width: 2160px; height: 3840px; }
    .shot { position: absolute; inset: 0; overflow: hidden; background: #000; }
    .shot img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    /* Isolates one bead: everything beyond a soft circle falls to black. */
    .iris { position: absolute; inset: 0;
      background: radial-gradient(circle 560px at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,1) 100%); }
  </style>
  <div id="root" data-composition-id="closing" data-width="2160" data-height="3840">
    <canvas id="cl-stars" data-layout-ignore width="2160" height="3840"></canvas>
    <div id="cl-bead" class="shot clip" data-start="0" data-duration="4.2">
      <img id="cl-bead-img" src="assets/img/s1-mala.webp" alt="A single Rudraksha bead" />
      <div class="iris"></div>
    </div>
  </div>
  <script>
    (function () {
      const c = document.querySelector("#cl-stars");
      const ctx = c.getContext("2d");
      let s = 1080;
      const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      ctx.fillStyle = "#020205"; ctx.fillRect(0, 0, 2160, 3840);
      const neb = ctx.createRadialGradient(1500, 1200, 0, 1500, 1200, 1800);
      neb.addColorStop(0, "rgba(60,80,130,0.22)"); neb.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = neb; ctx.fillRect(0, 0, 2160, 3840);
      for (let i = 0; i < 1800; i++) {
        const x = rnd() * 2160, y = rnd() * 3840, r = rnd() < 0.95 ? 0.6 + rnd() * 1.5 : 2.2 + rnd() * 1.8;
        const a = 0.2 + rnd() * 0.7;
        ctx.fillStyle = rnd() < 0.2 ? `rgba(255,226,190,${a})` : `rgba(210,225,255,${a})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    })();
    const tl = gsap.timeline({ paused: true });
    // A single bead (the top bead of the hook shot) — slow push, then it dissolves into the stars.
    tl.fromTo("#cl-bead", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out" }, 0);
    tl.fromTo("#cl-bead-img", { scale: 3.0, xPercent: -12.6, yPercent: 9.8, transformOrigin: "50% 50%" },
      { scale: 3.4, xPercent: -14.3, yPercent: 11.6, duration: 4.2, ease: "sine.inOut" }, 0);
    tl.to("#cl-bead", { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 3.2);
    tl.fromTo("#cl-stars", { scale: 1.12 }, { scale: 1.0, duration: 7.9, ease: "sine.out" }, 0);
    tl.fromTo("#cl-stars", { opacity: 0 }, { opacity: 1, duration: 3.0, ease: "sine.out" }, 0);
    // Hand-off to the signature ending, which opens on near-black.
    tl.to("#cl-stars", { opacity: 0, duration: 0.6, ease: "sine.in" }, 7.3);
    window.__timelines["closing"] = tl;
  </script>
</template>
