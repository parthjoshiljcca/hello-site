name: CI/CD
on: [push]

jobs:
  pipelines:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Unit tests
      run: |
        cd server
        npm ci
        npm test
    - name: Build the Docker Image
      run: docker build -t hello-site .
    - name: Test the running container
      run: |
        docker run -d -p 8080:80 hello-site
        sleep 3
        curl -s http://localhost:8080 | grep "NutriPulse"
        curl -s http://localhost:8080/api/health | grep '"ok":true'
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Push the SAME tested image
      run: |
          docker tag hello-site ${{ secrets.DOCKERHUB_USERNAME }}/hello-site
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-site
